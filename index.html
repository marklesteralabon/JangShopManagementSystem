  };
})();
</script>


<script>
/* =====================================================
   FINAL SALES SAVE FIX
   The Supabase transactions table does not have an "items"
   column. Save only the confirmed transaction columns.
===================================================== */
(function(){
  window.completeSale=async function(){
    if(!card.length){alert('Cart is empty.');return}

    const subtotal=card.reduce((s,i)=>s+Number(i.price||0)*Number(i.qty||0),0);
    let discount=Math.max(0,Number(document.getElementById('saleDiscount')?.value||0));
    discount=Math.min(discount,subtotal);
    const total=subtotal-discount;
    const pay=Number(document.getElementById('paymentReceived')?.value||0);

    if(pay<total){
      alert('Payment is not enough. Total: '+money(total));
      return;
    }

    const saleCart=card.map(i=>({...i}));
    for(const item of saleCart){
      const p=products.find(x=>String(x.id)===String(item.productId));
      if(!p || Number(p.stock)<Number(item.qty)){
        alert('Insufficient stock for '+item.name);
        return;
      }
    }

    const profit=saleCart.reduce((s,i)=>
      s+(Number(i.price||0)-Number(i.cost||0))*Number(i.qty||0),0)-discount;

    const tx={
      id:'TX-'+Date.now()+'-'+Math.random().toString(36).slice(2,8),
      date:new Date().toISOString(),
      branch:currentUser?.branch||'Main Branch',
      employee:currentUser?.name||'',
      employeeId:String(currentUser?.id||currentUser?.employeeId||''),
      items:saleCart,
      total,subtotal,discount,profit,
      customerName:document.getElementById('customerName')?.value||'',
      customerContact:document.getElementById('customerContact')?.value||'',
      payment:pay,
      change:pay-total
    };

    /*
      IMPORTANT:
      Do not send tx.items to the transactions table because the
      actual table schema does not contain an items column.
    */
    if(navigator.onLine && databaseReady && typeof _supabase!=='undefined'){
      try{
        const {error}=await _supabase.from('transactions').insert({
          id:tx.id,
          date:tx.date,
          branch:tx.branch,
          employee:tx.employee,
          employee_id:tx.employeeId,
          total:tx.total,
          profit:tx.profit
        });
        if(error) throw error;

        // Server save succeeded. Now update local stock.
        saleCart.forEach(i=>{
          const p=products.find(x=>String(x.id)===String(i.productId));
          if(p) p.stock=Number(p.stock)-Number(i.qty);
        });

        transactions=Array.isArray(transactions)?transactions:[];
        transactions=transactions.filter(t=>String(t.id)!==String(tx.id));
        transactions.unshift(tx);
        saveLocalData();

        card=[];
        renderCart();
        if(typeof renderDashboard==='function') renderDashboard();
        if(typeof updateDbStatus==='function') updateDbStatus();

        alert('SALE COMPLETED\nTransaction: '+tx.id+'\nTotal: '+money(total)+'\nChange: '+money(tx.change)+'\nStatus: Saved to Supabase');
        if(typeof showReceipt==='function') showReceipt(tx);
        return;
      }catch(err){
        console.error('Supabase transaction save failed:',err);
        alert('Hindi na-save sa Supabase ang sale.\n\n'+(err.message||err)+'\n\nWalang local sale na tatanggalin at hindi muna iko-complete ang transaction.');
        return;
      }
    }

    // Offline: keep the full sale locally and queue only schema-safe fields.
    transactions=Array.isArray(transactions)?transactions:[];
    transactions=transactions.filter(t=>String(t.id)!==String(tx.id));
    transactions.unshift(tx);
    saleCart.forEach(i=>{
      const p=products.find(x=>String(x.id)===String(i.productId));
      if(p) p.stock=Number(p.stock)-Number(i.qty);
    });
    saveLocalData();

    if(typeof enqueueOffline==='function'){
      enqueueOffline('process_sale',{
        id:tx.id,date:tx.date,branch:tx.branch,employee:tx.employee,
        employee_id:tx.employeeId,total:tx.total,profit:tx.profit
      });
    }

    card=[];
    renderCart();
    if(typeof renderDashboard==='function') renderDashboard();
    if(typeof updateDbStatus==='function') updateDbStatus();
    alert('SALE COMPLETED\nTransaction: '+tx.id+'\nTotal: '+money(total)+'\nChange: '+money(tx.change)+'\nStatus: Saved locally / queued for sync');
    if(typeof showReceipt==='function') showReceipt(tx);
  };

  // Replace the offline queue handler so queued sales also match the real schema.
  const oldProcessQueue=window.processOfflineQueue;
  window.processOfflineQueue=async function(){
    if(!navigator.onLine || !databaseReady || typeof _supabase==='undefined') return;
    const queue=typeof getOfflineQueue==='function'?getOfflineQueue():[];
    if(!queue.length) return;

    const remaining=[];
    for(const action of queue){
      try{
        let result=null;
        if(action.type==='process_sale'){
          const d=action.data||{};
          result=await _supabase.from('transactions').upsert({
            id:d.id,date:d.date,branch:d.branch,employee:d.employee,
            employee_id:d.employee_id,total:d.total,profit:d.profit
          },{onConflict:'id',ignoreDuplicates:true});
        }else if(action.type==='insert_product'){
          result=await _supabase.from('products').upsert(action.data,{onConflict:'id',ignoreDuplicates:true});
        }else if(action.type==='insert_cash'){
          result=await _supabase.from('cash_collections').upsert(action.data,{onConflict:'id',ignoreDuplicates:true});
        }else if(action.type==='update_product_stock'){
          result=await _supabase.from('products').update({stock:action.data.stock}).eq('id',action.data.id);
        }else{
          continue;
        }
        if(result?.error) throw result.error;
      }catch(e){
        action.attempts=Number(action.attempts||0)+1;
        action.lastError=e?.message||String(e);
        remaining.push(action);
      }
    }
    if(typeof saveOfflineQueue==='function') saveOfflineQueue(remaining);
    if(typeof updateDbStatus==='function') updateDbStatus();
  };
})();
</script>


<script>
/* =====================================================
   AUTO TARGET STOCK + COLLAPSIBLE DASHBOARD
   8-week sales history • 3-week coverage • 20% safety buffer
===================================================== */
(function(){
  const AUTO_TARGET_KEY='motorShop_autoTargetStock_v1';
  const WEEK_MS=7*24*60*60*1000;

  function saleItems(tx){
    return Array.isArray(tx?.items)?tx.items:[];
  }

  function calculateAutoTarget(product){
    const now=Date.now();
    const since=now-(8*WEEK_MS);
    let units=0;

    (Array.isArray(transactions)?transactions:[]).forEach(tx=>{
      const d=new Date(tx.date||0).getTime();
      if(!d || d<since) return;
      saleItems(tx).forEach(item=>{
        const sameId=String(item.productId??'')===String(product.id);
        const sameSku=product.sku && item.sku && String(item.sku)===String(product.sku);
        if(sameId || sameSku) units+=Number(item.qty||0);
      });
    });

    // Average weekly sales over the full 8-week window.
    const avgWeekly=units/8;
    // Three weeks of coverage plus 20% safety buffer.
    const suggested=Math.ceil(avgWeekly*3*1.20);

    // Do not erase a deliberately higher existing target.
    return Math.max(Number(product.target||0), suggested, Number(product.min||0));
  }

  function refreshAutoTargets(force=false){
    if(!Array.isArray(products) || !products.length) return;
    const now=Date.now();
    let state={};
    try{state=JSON.parse(localStorage.getItem(AUTO_TARGET_KEY)||'{}')||{};}catch(e){state={};}

    // Recalculate once per week unless explicitly forced.
    const last=Number(state.lastRun||0);
    if(!force && now-last<7*24*60*60*1000) return;

    products.forEach(p=>{
      const target=calculateAutoTarget(p);
      if(target>Number(p.target||0)) p.target=target;
    });

    state.lastRun=now;
    localStorage.setItem(AUTO_TARGET_KEY,JSON.stringify(state));
    if(typeof saveLocalData==='function') saveLocalData();

    // Sync changed targets to Supabase when the field exists in the existing schema.
    if(navigator.onLine && typeof databaseReady!=='undefined' && databaseReady && typeof _supabase!=='undefined'){
      Promise.all((products||[]).map(async p=>{
        try{
          return await _supabase.from('products').update({target:Number(p.target||0)}).eq('id',p.id);
        }catch(e){ return null; }
      })).catch(()=>{});
    }
  }

  window.refreshAutoTargets=refreshAutoTargets;

  // Recalculate after initial data synchronization.
  window.addEventListener('load',()=>setTimeout(()=>refreshAutoTargets(false),1800));

  /* Collapsible dashboard sections. Existing dashboard data is preserved;
     this wrapper only changes presentation. */
  function makeDashboardCollapsible(){
    const main=document.getElementById('mainContent');
    if(!main || main.dataset.collapsibleApplied==='1') return;
    const titles=[...main.querySelectorAll('.section-title')];
    if(titles.length<2) return;

    titles.forEach((title,index)=>{
      const body=[];
      let n=title.nextElementSibling;
      while(n && !n.classList.contains('section-title')){
        body.push(n);
        n=n.nextElementSibling;
      }
      const wrap=document.createElement('div');
      wrap.className='dashboard-collapsible';
      wrap.style.marginBottom='10px';
      const head=document.createElement('button');
      head.type='button';
      head.style.cssText='width:100%;text-align:left;padding:13px 15px;border:1px solid #ddd;border-radius:10px;background:#fff;font-weight:700;font-size:15px;display:flex;justify-content:space-between;align-items:center;';
      head.innerHTML='<span>'+title.textContent+'</span><span>＋</span>';

      const content=document.createElement('div');
      content.style.display='none';
      content.style.marginTop='6px';
      body.forEach(x=>content.appendChild(x));

      head.onclick=()=>{
        const open=content.style.display!=='none';
        content.style.display=open?'none':'block';
        head.lastElementChild.textContent=open?'＋':'−';
      };

      title.replaceWith(wrap);
      wrap.appendChild(head);
      wrap.appendChild(content);
    });
    main.dataset.collapsibleApplied='1';
  }

  const oldRenderDashboard=window.renderDashboard;
  if(typeof oldRenderDashboard==='function'){
    window.renderDashboard=function(){
      oldRenderDashboard.apply(this,arguments);
      setTimeout(makeDashboardCollapsible,0);
    };
  }
  window.makeDashboardCollapsible=makeDashboardCollapsible;

  // Also apply after navigation because different dashboard implementations
  // may render asynchronously.
  const observer=new MutationObserver(()=>{
    const main=document.getElementById('mainContent');
    if(main && main.querySelector('.section-title')) makeDashboardCollapsible();
  });
  window.addEventListener('load',()=>{
    const main=document.getElementById('mainContent');
    if(main) observer.observe(main,{childList:true,subtree:true});
  });
})();
</script>


<script>
/* =========================================================
   FINAL UPDATE PATCH v4.9
   - explicit TEST/ACTUAL transaction marker
   - owner-only test-data cleanup
   - automatic target stock / suggested restock
   - clickable restock + history
   - draggable low-stock notification
   - employee concise dashboard + cash due
   - profit-based commission setting/display
   - owner branding settings
   - cash collection outstanding balance continuity
   ========================================================= */
(function(){
  'use strict';

  function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function num(v){return Number(v)||0;}
  function money9(v){
    return typeof window.money==='function' ? window.money(num(v)) :
      '₱'+num(v).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
  }
  function getTransactions(){ return Array.isArray(window.transactions)?window.transactions:[]; }
  function save(){ try{ if(typeof window.saveLocalData==='function') window.saveLocalData(); }catch(e){} }
  function role(){return window.currentUser?.role||'';}
  function owner(){return role()==='owner';}

  /* ---------- TEST / ACTUAL distinction ---------- */
  function ensureTxMode(tx){
    if(!tx) return tx;
    if(typeof tx.is_test!=='boolean') tx.is_test=false; // safe default = ACTUAL
    tx.mode=tx.is_test?'TEST':'ACTUAL';
    return tx;
  }
  getTransactions().forEach(ensureTxMode);

  window.setTransactionTestMode=function(tx,isTest){
    if(!tx) return;
    tx.is_test=!!isTest; tx.mode=tx.is_test?'TEST':'ACTUAL'; save();
  };

  /* ---------- Automatic Target Stock ---------- */
  function salesLastWeeks(productId,weeks){
    const cutoff=Date.now()-weeks*7*86400000;
    let qty=0;
    getTransactions().filter(t=>!t.is_test && new Date(t.date||0).getTime()>=cutoff)
      .forEach(t=>(t.items||[]).forEach(i=>{
        if(String(i.productId??i.sku??i.name)===String(productId)) qty+=num(i.qty);
      }));
    return qty;
  }
  window.getAutoTargetStock=function(p){
    if(!p) return 0;
    const weekly=salesLastWeeks(p.id??p.sku??p.name,8)/8;
    if(weekly<=0) return Math.max(1, num(p.stock)||1);
    return Math.max(1,Math.ceil(weekly*3*1.20));
  };
  window.getSuggestedRestockQty=function(p){
    return Math.max(0,window.getAutoTargetStock(p)-num(p.stock));
  };

  /* ---------- Owner-only test cleanup ---------- */
  window.clearTestData=function(){
    if(!owner()){alert('Owner access required.');return;}
    const before=getTransactions().length;
    window.transactions=getTransactions().filter(t=>!t.is_test);
    let removed=before-window.transactions.length;
    if(Array.isArray(window.pendingRestocks)){
      const rb=window.pendingRestocks.length;
      window.pendingRestocks=window.pendingRestocks.filter(r=>!r.is_test);
      removed += rb-window.pendingRestocks.length;
    }
    save();
    alert('Test data cleared. Removed '+removed+' test transaction/restock record(s). Actual sales and products were retained.');
    if(typeof renderDashboard==='function') renderDashboard();
  };

  /* ---------- Restock action ---------- */
  window.performSuggestedRestock=function(productId){
    if(!owner()){alert('Owner access required.');return;}
    const p=(window.products||[]).find(x=>String(x.id)===String(productId));
    if(!p){alert('Item not found.');return;}
    const suggested=window.getSuggestedRestockQty(p);
    const q=prompt('Restock '+(p.name||p.sku||'item')+'\nCurrent stock: '+num(p.stock)+'\nSuggested quantity: '+suggested+'\n\nEnter quantity:',String(suggested));
    if(q===null)return;
    const qty=Math.floor(num(q));
    if(qty<=0){alert('Please enter a quantity greater than 0.');return;}
    p.stock=num(p.stock)+qty;
    if(!Array.isArray(window.stockMovements)) window.stockMovements=[];
    window.stockMovements.push({id:'REST-'+Date.now(),type:'RESTOCK',productId:p.id,productName:p.name,qty,date:new Date().toISOString(),by:window.currentUser?.name||window.currentUser?.id||'Owner'});
    if(!Array.isArray(window.pendingRestocks)) window.pendingRestocks=[];
    window.pendingRestocks=window.pendingRestocks.filter(r=>String(r.productId)!==String(p.id));
    save();
    alert('Restock saved: '+qty+' unit(s) added to '+(p.name||'item')+'.');
    if(typeof renderRestock==='function') renderRestock();
    if(typeof renderInventory==='function') renderInventory();
  };

  /* ---------- Cash collection continuity ---------- */
  window.getEmployeeCashState=function(employeeId){
    const tx=getTransactions().filter(t=>!t.is_test && String(t.employeeId)===String(employeeId));
    let collected=0;
    (window.cashCollections||[]).filter(c=>String(c.employeeId)===String(employeeId)).forEach(c=>collected+=num(c.amount));
    const gross=tx.reduce((s,t)=>s+num(t.total),0);
    const outstanding=Math.max(0,gross-collected);
    return {sales:tx,gross, collected, outstanding, pendingSales:tx.filter(t=>!t.cashCollected).length};
  };

  /* ---------- Profit-based commission ---------- */
  window.getEmployeeCommission=function(employeeId){
    const e=(window.employees||[]).find(x=>String(x.employeeId)===String(employeeId));
    const rate=num(e?.commissionRate ?? window.systemSettings?.commissionRate ?? 0);
    const profit=getTransactions().filter(t=>!t.is_test && String(t.employeeId)===String(employeeId))
      .reduce((s,t)=>s+num(t.profit),0);
    return {rate,profit,commission:profit*rate/100};
  };

  /* ---------- Owner branding ---------- */
  window.systemSettings=window.systemSettings||{};
  window.saveBrandingSettings=function(){
    if(!owner()){alert('Owner access required.');return;}
    const name=document.getElementById('brandShopName')?.value?.trim();
    const logo=document.getElementById('brandLogoUrl')?.value?.trim();
    const title=document.getElementById('brandLoginTitle')?.value?.trim();
    if(name!==undefined) window.systemSettings.shopName=name||'Motor Shop';
    if(logo!==undefined) window.systemSettings.logoUrl=logo;
    if(title!==undefined) window.systemSettings.loginTitle=title||window.systemSettings.shopName||'Motor Shop';
    save(); applyBranding(); alert('Branding saved.');
  };
  window.applyBranding=function(){
    const s=window.systemSettings||{};
    if(s.shopName) document.querySelectorAll('[data-shop-name]').forEach(x=>x.textContent=s.shopName);
    if(s.loginTitle){const x=document.querySelector('[data-login-title]');if(x)x.textContent=s.loginTitle;}
    if(s.logoUrl) document.querySelectorAll('[data-shop-logo]').forEach(x=>{x.src=s.logoUrl;x.style.display='block';});
    if(s.loginTitle) document.title=s.loginTitle;
  };

  /* ---------- Draggable low-stock panel ---------- */
  window.makeStockNotificationDraggable=function(){
    const box=document.getElementById('stockNotification');
    if(!box||box.dataset.dragReady)return;
    box.dataset.dragReady='1';
    box.style.position='fixed'; box.style.zIndex='99999'; box.style.cursor='default';
    let drag=false,ox=0,oy=0;
    box.addEventListener('pointerdown',e=>{
      if(e.target.closest('button,a,input,select,textarea'))return;
      drag=true; ox=e.clientX-box.offsetLeft; oy=e.clientY-box.offsetTop;
      try{box.setPointerCapture(e.pointerId)}catch(_){}
    });
    box.addEventListener('pointermove',e=>{
      if(!drag)return;
      box.style.left=Math.max(0,e.clientX-ox)+'px';
      box.style.top=Math.max(0,e.clientY-oy)+'px';
      box.style.right='auto'; box.style.bottom='auto';
    });
    box.addEventListener('pointerup',()=>drag=false);
  };

  /* ---------- Concise employee dashboard ---------- */
  window.renderEmployeeSimpleSummary=function(container){
    if(!container||!window.currentUser)return;
    const id=window.currentUser.id;
    const state=window.getEmployeeCashState(id);
    const comm=window.getEmployeeCommission(id);
    container.innerHTML =
      '<div class="card"><div class="section-title">📊 Today</div>'+
      '<div class="row"><span>Sales</span><strong>'+money9(state.sales.filter(t=>new Date(t.date).toDateString()===new Date().toDateString()).reduce((s,t)=>s+num(t.total),0))+'</strong></div>'+
      '<div class="row"><span>Cash Due</span><strong>'+money9(state.outstanding)+'</strong></div>'+
      '<div class="row"><span>Commission</span><strong>'+money9(comm.commission)+'</strong></div>'+
      '<button class="btn btn-dark" style="margin-top:10px" onclick="window.showEmployeeTransactionDetails()">VIEW DETAILS</button></div>';
  };
  window.showEmployeeTransactionDetails=function(){
    const id=window.currentUser?.id, state=window.getEmployeeCashState(id);
    const rows=state.sales.map(t=>'<div class="row"><span>'+esc(t.id)+'</span><strong>'+money9(t.total)+'</strong></div>').join('');
    if(typeof window.showModal==='function') window.showModal('Transaction Details',
      '<div class="card"><div class="row"><span>Cash Due</span><strong>'+money9(state.outstanding)+'</strong></div>'+
      '<hr>'+rows+'</div>');
    else alert('Cash Due: '+money9(state.outstanding));
  };

  /* ---------- Owner customization panel ---------- */
  window.renderBrandingSettings=function(container){
    if(!owner()||!container)return;
    const s=window.systemSettings||{};
    container.innerHTML='<div class="card"><h3>🎨 System Branding</h3>'+
      '<label>Shop Name</label><input id="brandShopName" class="input" value="'+esc(s.shopName||'Motor Shop')+'">'+
      '<label style="display:block;margin-top:10px">Logo URL</label><input id="brandLogoUrl" class="input" value="'+esc(s.logoUrl||'')+'">'+
      '<label style="display:block;margin-top:10px">Login Page Title</label><input id="brandLoginTitle" class="input" value="'+esc(s.loginTitle||'Motor Shop')+'">'+
      '<button class="btn btn-dark" style="margin-top:12px" onclick="saveBrandingSettings()">SAVE BRANDING</button></div>';
  };

  /* ---------- Owner cleanup button ---------- */
  window.renderTestCleanupControl=function(container){
    if(!owner()||!container)return;
    container.insertAdjacentHTML('beforeend','<div class="card" style="margin-top:10px"><h3>🧹 Test Data</h3><p class="muted">Removes TEST transactions/restock records only. Actual sales and products are retained.</p><button class="btn btn-dark" onclick="clearTestData()">CLEAR TEST DATA</button></div>');
  };

  /* ---------- Commission setting helper ---------- */
  window.setEmployeeCommissionRate=function(employeeId,rate){
    if(!owner()){alert('Owner access required.');return;}
    const e=(window.employees||[]).find(x=>String(x.employeeId)===String(employeeId));
    if(!e){alert('Employee not found.');return;}
    e.commissionRate=Math.max(0,num(rate)); save();
  };

  window.addEventListener('load',function(){
    try{applyBranding();}catch(e){}
    setTimeout(makeStockNotificationDraggable,500);
    setTimeout(function(){
      const box=document.getElementById('stockNotification');
      if(box) makeStockNotificationDraggable();
    },1500);
  });

  window.addEventListener('click',function(){
    setTimeout(function(){try{makeStockNotificationDraggable();}catch(e){}},50);
  });
})();
</script>


<script id="v49-final-fix-js">
(function(){
  function cleanEnd(){
    const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT),a=[];
    while(w.nextNode())a.push(w.currentNode);
    a.forEach(n=>{if(/\/end/i.test(n.nodeValue))n.nodeValue=n.nodeValue.replace(/\/end/gi,'')});
  }
  function makeDraggable(el){
    if(!el || el.dataset.msDragReady)return;
    el.dataset.msDragReady="1";
    const handle=el.querySelector('.modal-header,.popup-header,.notification-header,.header')||el;
    let drag=false,dx=0,dy=0;
    handle.style.cursor='move';
    handle.addEventListener('pointerdown',e=>{
      drag=true; const r=el.getBoundingClientRect();
      dx=e.clientX-r.left; dy=e.clientY-r.top;
      try{handle.setPointerCapture(e.pointerId)}catch(_){}
    });
    handle.addEventListener('pointermove',e=>{
      if(!drag)return;
      el.style.left=Math.max(0,e.clientX-dx)+'px';
      el.style.top=Math.max(0,e.clientY-dy)+'px';
      el.style.right='auto'; el.style.bottom='auto';
      el.style.position='fixed';
    });
    handle.addEventListener('pointerup',()=>drag=false);
  }
  window.addEventListener('load',()=>{
    cleanEnd();
    document.querySelectorAll('.modal,.popup,.notification').forEach(makeDraggable);
    setTimeout(cleanEnd,800);
  });
  new MutationObserver(()=>cleanEnd()).observe(document.documentElement,{subtree:true,childList:true,characterData:true});
})();
</script>
