<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Motor Shop Management System V3.2</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f6f8;
    color:#222;
    min-height:100vh;
    padding-bottom:75px;
}

button,input,select{
    font:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* ================= LOGIN ================= */
#loginScreen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:#111827;
}

.login-box{
    width:100%;
    max-width:400px;
    background:white;
    border-radius:24px;
    padding:25px;
    box-shadow:0 15px 40px rgba(0,0,0,.25);
}

.logo{
    width:70px;
    height:70px;
    margin:0 auto 15px;
    border-radius:20px;
    background:#111827;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:36px;
}

.login-box h1{
    text-align:center;
    font-size:24px;
}

.login-subtitle{
    text-align:center;
    color:#6b7280;
    font-size:13px;
    margin:6px 0 22px;
}

.role-buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:15px;
}

.role-btn{
    padding:13px;
    border:2px solid #e5e7eb;
    background:white;
    border-radius:12px;
    font-weight:bold;
}

.role-btn.active{
    background:#111827;
    color:white;
    border-color:#111827;
}

.form-group{
    margin-bottom:13px;
}

.form-group label{
    display:block;
    font-size:12px;
    font-weight:bold;
    margin-bottom:6px;
}

.form-group input,
.form-group select{
    width:100%;
    border:1px solid #d1d5db;
    border-radius:11px;
    padding:12px;
    outline:none;
    background:white;
}

.form-group input:focus,
.form-group select:focus{
    border-color:#111827;
}

.login-btn{
    width:100%;
    border:0;
    background:#111827;
    color:white;
    padding:14px;
    border-radius:12px;
    font-weight:bold;
    margin-top:5px;
}

.login-hint{
    text-align:center;
    color:#9ca3af;
    font-size:11px;
    margin-top:12px;
}

/* ================= APP ================= */
#app{
    display:none;
}

#app.show{
    display:block;
}

/* ================= HEADER ================= */
.header{
    background:#111827;
    color:white;
    padding:17px 18px;
    border-radius:0 0 22px 22px;
}

.header-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.account-info{
    position:relative;
}

.account-label{
    font-size:10px;
    opacity:.6;
}

.account-name{
    font-size:20px;
    font-weight:bold;
    margin-top:4px;
    cursor:pointer;
}

.account-name::after{
    content:" ▾";
    font-size:13px;
    opacity:.7;
}

.account-role{
    font-size:11px;
    opacity:.7;
    margin-top:3px;
}

.profile-icon{
    width:46px;
    height:46px;
    border-radius:50%;
    background:#374151;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:23px;
    cursor:pointer;
}

/* ================= PROFILE DROPDOWN ================= */
.profile-menu{
    display:none;
    position:absolute;
    top:63px;
    left:0;
    width:235px;
    background:white;
    color:#222;
    border-radius:15px;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
    overflow:hidden;
    z-index:1000;
}

.profile-menu.show{
    display:block;
}

.menu-header{
    background:#f3f4f6;
    padding:14px;
}

.menu-header strong{
    display:block;
}

.menu-header small{
    color:#6b7280;
    font-size:11px;
}

.menu-item{
    padding:13px 15px;
    border-bottom:1px solid #eee;
    font-size:13px;
    cursor:pointer;
}

.menu-item:hover{
    background:#f3f4f6;
}

.menu-item.logout{
    color:#dc2626;
    font-weight:bold;
}

/* ================= MAIN ================= */
.container{
    max-width:800px;
    margin:auto;
    padding:15px;
}

.date-box{
    text-align:center;
    margin:8px 0 17px;
}

.date-box strong{
    font-size:18px;
}

.date-box small{
    display:block;
    color:#6b7280;
    margin-top:4px;
}

/* ================= CARDS ================= */
.sales-card{
    background:white;
    padding:21px;
    border-radius:20px;
    box-shadow:0 3px 12px rgba(0,0,0,.07);
    margin-bottom:12px;
}

.sales-label{
    color:#6b7280;
    font-size:13px;
}

.sales-amount{
    font-size:34px;
    font-weight:bold;
    margin-top:6px;
}

.sales-note{
    color:#16a34a;
    font-size:12px;
    margin-top:6px;
}

.summary-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.summary-card{
    background:white;
    padding:15px;
    border-radius:16px;
    box-shadow:0 2px 8px rgba(0,0,0,.05);
}

.summary-icon{
    font-size:24px;
}

.summary-title{
    color:#6b7280;
    font-size:11px;
    margin-top:7px;
}

.summary-value{
    font-size:20px;
    font-weight:bold;
    margin-top:4px;
}

.section-title{
    font-size:17px;
    font-weight:bold;
    margin:21px 0 9px;
}

/* ================= GENERIC ================= */
.card{
    background:white;
    border-radius:16px;
    padding:15px;
    margin-bottom:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.05);
}

.row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.muted{
    color:#6b7280;
    font-size:12px;
}

.small{
    font-size:12px;
}

.bold{
    font-weight:bold;
}

.amount{
    font-weight:bold;
}

.btn{
    border:0;
    border-radius:10px;
    padding:10px 13px;
    font-weight:bold;
}

.btn-dark{
    background:#111827;
    color:white;
}

.btn-green{
    background:#16a34a;
    color:white;
}

.btn-red{
    background:#dc2626;
    color:white;
}

.btn-gray{
    background:#e5e7eb;
    color:#111;
}

.btn-blue{
    background:#2563eb;
    color:white;
}

.btn-orange{
    background:#ea580c;
    color:white;
}

/* ================= MY SALES ================= */
.my-sales{
    background:white;
    border-radius:16px;
    padding:17px;
    box-shadow:0 2px 8px rgba(0,0,0,.05);
}

.my-sales-value{
    font-size:26px;
    font-weight:bold;
    margin-top:4px;
}

/* ================= TRANSACTIONS ================= */
.transaction{
    background:white;
    padding:14px;
    border-radius:14px;
    margin-bottom:8px;
    box-shadow:0 2px 7px rgba(0,0,0,.04);
}

.status{
    display:inline-block;
    padding:4px 7px;
    border-radius:6px;
    font-size:9px;
    font-weight:bold;
    background:#dcfce7;
    color:#15803d;
    margin-top:6px;
}

/* ================= ALERT ================= */
.alert{
    background:white;
    border-left:5px solid #ef4444;
    border-radius:12px;
    padding:13px;
    margin-bottom:8px;
}

.alert strong{
    display:block;
}

.alert small{
    color:#6b7280;
}

/* ================= QUICK ================= */
.quick-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:9px;
}

.quick{
    background:white;
    border-radius:14px;
    padding:14px 6px;
    text-align:center;
    box-shadow:0 2px 8px rgba(0,0,0,.05);
    cursor:pointer;
}

.quick-icon{
    font-size:24px;
}

.quick span{
    display:block;
    font-size:10px;
    font-weight:bold;
    margin-top:6px;
}

/* ================= FORMS ================= */
.form-card{
    background:white;
    padding:16px;
    border-radius:17px;
    box-shadow:0 2px 8px rgba(0,0,0,.05);
}

.input-group{
    margin-bottom:12px;
}

.input-group label{
    display:block;
    font-size:11px;
    font-weight:bold;
    margin-bottom:5px;
}

.input-group input,
.input-group select{
    width:100%;
    padding:11px;
    border:1px solid #d1d5db;
    border-radius:10px;
    background:white;
}

.two-col{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

/* ================= AUTOCOMPLETE ================= */
.autocomplete{
    position:relative;
}

.suggestions{
    position:absolute;
    left:0;
    right:0;
    top:100%;
    background:white;
    border:1px solid #ddd;
    border-radius:10px;
    overflow:hidden;
    z-index:100;
    box-shadow:0 6px 15px rgba(0,0,0,.12);
}

.suggestion{
    padding:11px;
    border-bottom:1px solid #eee;
    cursor:pointer;
}

.suggestion:hover{
    background:#f3f4f6;
}

.suggestion strong{
    display:block;
    font-size:13px;
}

.suggestion small{
    color:#6b7280;
}

/* ================= TABLE ================= */
.table-wrap{
    overflow-x:auto;
    background:white;
    border-radius:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.05);
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:650px;
}

th,td{
    padding:10px;
    border-bottom:1px solid #eee;
    text-align:left;
    font-size:11px;
}

th{
    background:#f3f4f6;
}

/* ================= CART ================= */
.cart-item{
    background:#f9fafb;
    border-radius:10px;
    padding:11px;
    margin-bottom:7px;
}

.qty-controls{
    display:flex;
    align-items:center;
    gap:7px;
    margin-top:8px;
}

.qty-btn{
    width:28px;
    height:28px;
    border:0;
    border-radius:7px;
    background:#e5e7eb;
}

/* ================= MODAL ================= */
.modal-bg{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    z-index:2000;
    align-items:center;
    justify-content:center;
    padding:18px;
}

.modal-bg.show{
    display:flex;
}

.modal{
    background:white;
    width:100%;
    max-width:430px;
    max-height:90vh;
    overflow:auto;
    border-radius:20px;
    padding:20px;
}

.modal h3{
    margin-bottom:15px;
}

.modal-actions{
    display:flex;
    gap:8px;
    margin-top:15px;
}

.modal-actions button{
    flex:1;
}

.profile-picture{
    width:90px;
    height:90px;
    border-radius:50%;
    background:#e5e7eb;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:42px;
    margin:0 auto 15px;
}

.info-box{
    background:#f3f4f6;
    border-radius:11px;
    padding:11px;
    margin-bottom:8px;
}

.info-box small{
    display:block;
    color:#6b7280;
    font-size:10px;
}

.info-box strong{
    display:block;
    margin-top:3px;
}

/* ================= BOTTOM NAV ================= */
.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:65px;
    background:white;
    border-top:1px solid #ddd;
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:500;
}

.nav{
    text-align:center;
    color:#6b7280;
    font-size:9px;
    cursor:pointer;
}

.nav.active{
    color:#111827;
    font-weight:bold;
}

.nav-icon{
    display:block;
    font-size:20px;
    margin-bottom:3px;
}

/* ================= PRINT ================= */
#printArea{
    display:none;
}

@media print{
    body *{
        visibility:hidden;
    }
    #printArea,
    #printArea *{
        visibility:visible;
    }
    #printArea{
        display:block;
        position:absolute;
        left:0;
        top:0;
        width:100%;
    }
}

/* ================= MOBILE ================= */
@media(max-width:420px){
    .sales-amount{
        font-size:29px;
    }
    .summary-value{
        font-size:18px;
    }
    .quick-grid{
        grid-template-columns:repeat(3,1fr);
    }
}
</style>
</head>

<body>

<!-- =====================================================
     LOGIN
===================================================== -->
<div id="loginScreen">
    <div class="login-box">
        <div class="logo">🏍️</div>
        <h1>Motor Shop</h1>
        <div class="login-subtitle">Management System V3.2</div>

        <div class="role-buttons">
            <button class="role-btn active" id="ownerRoleBtn" onclick="selectLoginRole('owner')">👑 Owner</button>
            <button class="role-btn" id="employeeRoleBtn" onclick="selectLoginRole('employee')">👨‍🔧 Employee</button>
        </div>

        <div class="form-group">
            <label>Name / Username</label>
            <input id="loginName" type="text" placeholder="Enter name or username">
        </div>

        <div class="form-group">
            <label>Branch</label>
            <select id="loginBranch">
                <option>Main Branch</option>
                <option>Branch 2</option>
            </select>
        </div>

        <div class="form-group">
            <label>Password / PIN</label>
            <input id="loginPassword" type="password" placeholder="Enter password or PIN">
        </div>

        <button class="login-btn" onclick="login()">LOGIN</button>

        <div class="login-hint">Default Owner PIN: 1234 (Can be changed in settings)</div>
    </div>
</div>

<!-- =====================================================
     APP
===================================================== -->
<div id="app">
    <!-- HEADER -->
    <div class="header">
        <div class="header-top">
            <div class="account-info">
                <div class="account-label" id="accountLabel">OWNER DASHBOARD</div>
                <div class="account-name" id="accountName" onclick="toggleProfileMenu()">Owner</div>
                <div class="account-role" id="accountRole">Owner • Main Branch</div>
                <!-- PROFILE MENU -->
                <div class="profile-menu" id="profileMenu"></div>
            </div>
            <div class="profile-icon" id="profileIcon" onclick="toggleProfileMenu()">👑</div>
        </div>
    </div>

    <!-- CONTENT -->
    <div class="container" id="mainContent"></div>

    <!-- BOTTOM NAV -->
    <div class="bottom-nav" id="bottomNav"></div>
</div>

<!-- =====================================================
     MODAL
===================================================== -->
<div class="modal-bg" id="modalBg">
    <div class="modal">
        <h3 id="modalTitle">Modal</h3>
        <div id="modalContent"></div>
        <div class="modal-actions">
            <button class="btn btn-gray" onclick="closeModal()">Close</button>
        </div>
    </div>
</div>

<!-- PRINT AREA -->
<div id="printArea"></div>

<script>
/* =====================================================
   DATA & LOCAL STORAGE INIT
===================================================== */
const defaultProducts = [
    { id:1, name:"Engine Oil 10W-40", sku:"480001", supplier:"Sample Parts Supplier", cost:180, price:250, stock:8, min:5, target:20 },
    { id:2, name:"Spark Plug", sku:"480002", supplier:"Sample Parts Supplier", cost:80, price:120, stock:3, min:10, target:30 },
    { id:3, name:"Brake Pad Set", sku:"480003", supplier:"Sample Motorcycle Supplier", cost:220, price:350, stock:15, min:5, target:15 },
    { id:4, name:"Air Filter", sku:"480004", supplier:"Sample Motorcycle Supplier", cost:150, price:220, stock:4, min:5, target:15 }
];

const defaultSuppliers = [
    { id:1, name:"Sample Parts Supplier", contact:"09123456789" },
    { id:2, name:"Sample Motorcycle Supplier", contact:"09987654321" }
];

const defaultEmployees = [
    { id:1, name:"Juan Dela Cruz", employeeId:"EMP-001", branch:"Main Branch", position:"Mechanic", status:"Active", password:"1234" },
    { id:2, name:"Pedro Santos", employeeId:"EMP-002", branch:"Main Branch", position:"Cashier", status:"Active", password:"1234" },
    { id:3, name:"Carlos Reyes", employeeId:"EMP-003", branch:"Branch 2", position:"Sales Staff", status:"Active", password:"1234" }
];

// LOAD FROM LOCAL STORAGE (or use default if empty)
let products = JSON.parse(localStorage.getItem('ms_products')) || defaultProducts;
let suppliers = JSON.parse(localStorage.getItem('ms_suppliers')) || defaultSuppliers;
let employees = JSON.parse(localStorage.getItem('ms_employees')) || defaultEmployees;
let transactions = JSON.parse(localStorage.getItem('ms_transactions')) || [];
let cashCollections = JSON.parse(localStorage.getItem('ms_cashCollections')) || [];
let audits = JSON.parse(localStorage.getItem('ms_audits')) || [];
let OWNER_PIN = localStorage.getItem('ms_ownerPin') || "1234";

let currentUser = null;
let loginRole = "owner";
let cart = [];

// SAVE FUNCTION
function saveData() {
    localStorage.setItem('ms_products', JSON.stringify(products));
    localStorage.setItem('ms_suppliers', JSON.stringify(suppliers));
    localStorage.setItem('ms_employees', JSON.stringify(employees));
    localStorage.setItem('ms_transactions', JSON.stringify(transactions));
    localStorage.setItem('ms_cashCollections', JSON.stringify(cashCollections));
    localStorage.setItem('ms_audits', JSON.stringify(audits));
    localStorage.setItem('ms_ownerPin', OWNER_PIN);
}


/* =====================================================
   HELPERS
===================================================== */
function money(value){
    return "₱" + Number(value || 0).toLocaleString("en-PH",{ minimumFractionDigits:2, maximumFractionDigits:2 });
}

function todayString(dateObj = new Date()){
    return dateObj.toLocaleDateString("en-US",{ weekday:"long", year:"numeric", month:"long", day:"numeric" });
}

function isToday(date){
    const d = new Date(date);
    const n = new Date();
    return d.getDate()===n.getDate() && d.getMonth()===n.getMonth() && d.getFullYear()===n.getFullYear();
}

function todayTransactions(){
    return transactions.filter(t=>isToday(t.date));
}

function totalTodaySales(){
    return todayTransactions().reduce((sum,t)=>sum+Number(t.total),0);
}

function totalTodayProfit(){
    return todayTransactions().reduce((sum,t)=>sum+Number(t.profit),0);
}

function totalTodayTransactions(){
    return todayTransactions().length;
}

function totalTodayCollected(){
    return cashCollections.filter(c=>isToday(c.date)).reduce((sum,c)=>sum+Number(c.amount),0);
}

function lowStockProducts(){
    return products.filter(p=>p.stock<=p.min);
}

function employeeSales(employeeId){
    return todayTransactions().filter(t=>t.employeeId===employeeId).reduce((sum,t)=>sum+Number(t.total),0);
}

function employeeTransactionCount(employeeId){
    return todayTransactions().filter(t=>t.employeeId===employeeId).length;
}

function branchSales(branch){
    return todayTransactions().filter(t=>t.branch===branch).reduce((sum,t)=>sum+Number(t.total),0);
}

function branchTransactionCount(branch){
    return todayTransactions().filter(t=>t.branch===branch).length;
}

/* =====================================================
   LOGIN
===================================================== */
function selectLoginRole(role){
    loginRole=role;
    document.getElementById("ownerRoleBtn").classList.toggle("active",role==="owner");
    document.getElementById("employeeRoleBtn").classList.toggle("active",role==="employee");
}

function login(){
    const name = document.getElementById("loginName").value.trim();
    const branch = document.getElementById("loginBranch").value;
    const password = document.getElementById("loginPassword").value;

    if(!name || !password){
        alert("Please enter your login information.");
        return;
    }

    if(loginRole==="owner"){
        if(password!==OWNER_PIN){
            alert("Incorrect Owner PIN.");
            return;
        }
        currentUser={ role:"owner", name:name || "Owner", id:"OWNER-001", branch:branch, position:"Owner" };
    }
    else{
        const employee = employees.find(e=>
            (e.employeeId.toLowerCase()===name.toLowerCase() || e.name.toLowerCase()===name.toLowerCase())
            && e.branch===branch && e.password===password && e.status==="Active"
        );
        if(!employee){
            alert("Employee login failed.\n\nCheck Employee ID, branch and password.");
            return;
        }
        currentUser={ role:"employee", name:employee.name, id:employee.employeeId, branch:employee.branch, position:employee.position };
    }

    document.getElementById("loginScreen").style.display="none";
    document.getElementById("app").classList.add("show");
    setupHeader();
    renderDashboard();
}

/* =====================================================
   HEADER
===================================================== */
function setupHeader(){
    document.getElementById("accountName").textContent=currentUser.name;
    document.getElementById("accountRole").textContent=currentUser.position + " • " + currentUser.branch;

    if(currentUser.role==="owner"){
        document.getElementById("accountLabel").textContent="OWNER DASHBOARD";
        document.getElementById("profileIcon").textContent="👑";
        setupOwnerMenu();
    }else{
        document.getElementById("accountLabel").textContent="EMPLOYEE DASHBOARD";
        document.getElementById("profileIcon").textContent="👨‍🔧";
        setupEmployeeMenu();
    }
}

function setupOwnerMenu(){
    document.getElementById("profileMenu").innerHTML=`
        <div class="menu-header"><strong>${currentUser.name}</strong><small>Owner Account</small></div>
        <div class="menu-item" onclick="openOwnerProfile()">👤 My Profile</div>
        <div class="menu-item" onclick="openSettings()">⚙️ Settings</div>
        <div class="menu-item" onclick="showSection('employees')">👥 Employee Management</div>
        <div class="menu-item" onclick="openBranches()">🏪 Branch Management</div>
        <div class="menu-item" onclick="changePassword()">🔐 Change Password</div>
        <div class="menu-item" onclick="openSecurity()">🔒 Security</div>
        <div class="menu-item logout" onclick="logout()">🚪 Log Out</div>
    `;
}

function setupEmployeeMenu(){
    document.getElementById("profileMenu").innerHTML=`
        <div class="menu-header"><strong>${currentUser.name}</strong><small>${currentUser.id}</small></div>
        <div class="menu-item" onclick="openEmployeeProfile()">👤 My Profile</div>
        <div class="menu-item" onclick="openEmployeeSettings()">⚙️ Settings</div>
        <div class="menu-item" onclick="changePassword()">🔐 Change Password</div>
        <div class="menu-item logout" onclick="logout()">🚪 Log Out</div>
    `;
}

function toggleProfileMenu(){
    if(!currentUser) return;
    document.getElementById("profileMenu").classList.toggle("show");

function showProductSuggestions(inputId,suggestionId){
    const input=document.getElementById(inputId);
    const box=document.getElementById(suggestionId);
    if(!input || !box) return;
    const q=input.value.trim().toLowerCase();

    if(!q){
        box.innerHTML=""; return;
    }

    const matches=products.filter(p=>p.name.toLowerCase().includes(q) || p.sku.toLowerCase().includes(q));

    box.innerHTML=matches.map(p=>`
        <div class="suggestion" onclick="selectPOSProduct(${p.id})">
            <strong>${p.name}</strong>
            <small>SKU: ${p.sku} • Stock: ${p.stock} • ${money(p.price)}</small>
        </div>
    `).join("");

    if(!matches.length){
        box.innerHTML=`<div class="suggestion">No product found.</div>`;
    }
}

function selectPOSProduct(productId){
    const product=products.find(p=>p.id===productId);
    if(!product) return;

    if(product.stock<=0){
        alert("This product is out of stock."); return;
    }

    const existing=cart.find(i=>i.productId===productId);
    if(existing){
        if(existing.qty>=product.stock){
            alert("Not enough stock."); return;
        }
        existing.qty++;
    }else{
        cart.push({ productId:product.id, name:product.name, price:product.price, cost:product.cost, qty:1 });
    }

    const input=document.getElementById("posSearch");
    if(input) input.value="";
    const box=document.getElementById("posSuggestions");
    if(box) box.innerHTML="";
    renderCart();
}

function renderCart(){
    const area=document.getElementById("cartArea");
    if(!area) return;

    if(!cart.length){
        area.innerHTML=`<div class="card"><div style="text-align:center;padding:15px;color:#6b7280;">🛒 Cart is empty</div></div>`;
        return;
    }

    const total=cart.reduce((sum,i)=>sum+(i.price*i.qty),0);

    area.innerHTML=cart.map((item,index)=>`
        <div class="cart-item">
            <div class="row">
                <strong>${item.name}</strong>
                <strong>${money(item.price*item.qty)}</strong>
            </div>
            <div class="qty-controls">
                <button class="qty-btn" onclick="changeCartQty(${index},-1)">−</button>
                <strong>${item.qty}</strong>
                <button class="qty-btn" onclick="changeCartQty(${index},1)">+</button>
                <button class="btn btn-red" style="padding:7px 10px;margin-left:auto;" onclick="removeCartItem(${index})">Remove</button>
            </div>
        </div>
    `).join("")+`
        <div class="card">
            <div class="row"><strong>TOTAL</strong><strong style="font-size:22px;">${money(total)}</strong></div>
            <button class="btn btn-green" style="width:100%;margin-top:12px;" onclick="completeSale()">COMPLETE SALE</button>
        </div>
    `;
}

function changeCartQty(index,change){
    const item=cart[index];
    const product=products.find(p=>p.id===item.productId);
    item.qty+=change;

    if(item.qty<=0) cart.splice(index,1);
    if(product && item.qty>product.stock){
        item.qty=product.stock;
        alert("Maximum available stock reached.");
    }
    renderCart();
}

function removeCartItem(index){
    cart.splice(index,1);
    renderCart();
}

function completeSale(){
    if(!cart.length){ alert("Cart is empty."); return; }

    for(const item of cart){
        const product=products.find(p=>p.id===item.productId);
        if(!product || product.stock<item.qty){
            alert("Insufficient stock for " + item.name); return;
        }
    }

    let total=0;
    let profit=0;

    cart.forEach(item=>{
        const product=products.find(p=>p.id===item.productId);
        product.stock-=item.qty;
        total+=item.price*item.qty;
        profit+=(item.price-item.cost)*item.qty;
    });

    const tx={
        id:"TX-"+String(Date.now()).slice(-6),
        date:new Date().toISOString(),
        branch:currentUser.branch,
        employee:currentUser.name,
        employeeId:currentUser.id,
        items:cart.map(i=>({...i})),
        total:total,
        profit:profit
    };

    transactions.push(tx);
    saveData(); // Save to localStorage
    cart=[];

    alert("SALE COMPLETED\n\nTransaction: "+tx.id+"\nTotal: "+money(total));
    renderDashboard();
}

function addEmployee(){
    const name=document.getElementById("empName").value.trim();
    const employeeId=document.getElementById("empId").value.trim();
    const branch=document.getElementById("empBranch").value;
    const position=document.getElementById("empPosition").value.trim();
    const password=document.getElementById("empPassword").value;

    if(!name || !employeeId || !password){ alert("Name, Employee ID and password are required."); return; }
    if(employees.some(e=>e.employeeId.toLowerCase()===employeeId.toLowerCase())){ alert("Employee ID already exists."); return; }

    employees.push({ id:Date.now(), name, employeeId, branch, position:position || "Employee", status:"Active", password });
    saveData(); // Save

    closeModal();
    alert("Employee added successfully.");
    showSection("employees");
}

function editEmployee(id){
    const e=employees.find(x=>x.id===id);
    if(!e) return;
    showModal("👤 Edit Employee",`
        <div class="info-box"><small>Name</small><strong>${e.name}</strong></div>
        <div class="info-box"><small>Employee ID</small><strong>${e.employeeId}</strong></div>
        <div class="info-box"><small>Branch</small><strong>${e.branch}</strong></div>
        <div class="info-box"><small>Position</small><strong>${e.position}</strong></div>
        <button class="btn ${e.status==="Active"?"btn-red":"btn-green"}" style="width:100%;margin-top:10px;" onclick="toggleEmployeeStatus(${e.id})">
            ${e.status==="Active"?"Deactivate Employee":"Activate Employee"}
        </button>
    `);
}

function toggleEmployeeStatus(id){
    const e=employees.find(x=>x.id===id);
    if(!e) return;
    e.status = e.status==="Active" ? "Inactive" : "Active";
    saveData(); // Save
    closeModal();
    showSection("employees");
}

/* =====================================================
   REPORTS (With Date Filter)
===================================================== */
function renderReports(selectedDate = ""){
    // Use selected date or fallback to today
    const targetDate = selectedDate ? new Date(selectedDate) : new Date();
    
    // Filter transactions by the target date
    const filteredTx = transactions.filter(t => {
        const d = new Date(t.date);
        return d.getDate() === targetDate.getDate()
            && d.getMonth() === targetDate.getMonth()
            && d.getFullYear() === targetDate.getFullYear();
    });

    const sales = filteredTx.reduce((sum,t) => sum+Number(t.total), 0);
    const profit = filteredTx.reduce((sum,t) => sum+Number(t.profit), 0);
    const txCount = filteredTx.length;

    // Date formatter for the input field (YYYY-MM-DD)
    const formattedDateForInput = targetDate.getFullYear() + "-" + 
                                  String(targetDate.getMonth() + 1).padStart(2, '0') + "-" + 
                                  String(targetDate.getDate()).padStart(2, '0');

    document.getElementById("mainContent").innerHTML=`
        <div class="section-title">📊 Reports</div>

        <div class="card" style="margin-bottom: 15px;">
            <label style="font-size:12px; font-weight:bold;">Filter by Date:</label>
            <input type="date" id="reportDate" 
                   style="padding:10px; border-radius:8px; border:1px solid #ccc; width:100%; margin-top:5px;"
                   value="${formattedDateForInput}" 
                   onchange="renderReports(this.value)">
        </div>

        <div class="summary-grid">
            <div class="summary-card"><div class="summary-icon">💰</div><div class="summary-title">Sales</div><div class="summary-value">${money(sales)}</div></div>
            <div class="summary-card"><div class="summary-icon">📈</div><div class="summary-title">Profit</div><div class="summary-value">${money(profit)}</div></div>
            <div class="summary-card"><div class="summary-icon">🧾</div><div class="summary-title">Transactions</div><div class="summary-value">${txCount}</div></div>
            <div class="summary-card"><div class="summary-icon">📦</div><div class="summary-title">Total Products</div><div class="summary-value">${products.length}</div></div>
        </div>

        <div class="section-title">🧾 Transactions for ${todayString(targetDate)}</div>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr><th>ID</th><th>Time</th><th>Branch</th><th>Employee</th><th>Total</th><th>Profit</th></tr>
                </thead>
                <tbody>
                    ${filteredTx.length ? filteredTx.map(t=>`
                        <tr>
                            <td>${t.id}</td>
                            <td>${new Date(t.date).toLocaleTimeString()}</td>
                            <td>${t.branch}</td>
                            <td>${t.employee}</td>
                            <td>${money(t.total)}</td>
                            <td>${money(t.profit)}</td>
                        </tr>
                    `).join("") : `<tr><td colspan="6" style="text-align:center;">No transactions found for this date.</td></tr>`}
                </tbody>
            </table>
        </div>
    `;
}

function changePassword(){
    closeProfileMenu();
    showModal("🔐 Change Password",`
        <div class="input-group"><label>Current Password / PIN</label><input id="oldPassword" type="password"></div>
        <div class="input-group"><label>New Password</label><input id="newPassword" type="password"></div>
        <div class="input-group"><label>Confirm New Password</label><input id="confirmPassword" type="password"></div>
        <button class="btn btn-dark" style="width:100%;" onclick="savePassword()">CHANGE PASSWORD</button>
    `);
}

function savePassword(){
    const oldPassword=document.getElementById("oldPassword").value;
    const newPassword=document.getElementById("newPassword").value;
    const confirmPassword=document.getElementById("confirmPassword").value;

    if(currentUser.role==="owner"){
        if(oldPassword!==OWNER_PIN){ alert("Incorrect current Owner PIN."); return; }
    }else{
        const employee=employees.find(e=>e.employeeId===currentUser.id);
        if(!employee || employee.password!==oldPassword){ alert("Incorrect current password."); return; }
    }

    if(!newPassword){ alert("Enter a new password."); return; }
    if(newPassword!==confirmPassword){ alert("New passwords do not match."); return; }

    if(currentUser.role==="employee"){
        const employee=employees.find(e=>e.employeeId===currentUser.id);
        employee.password=newPassword;
    } else {
        OWNER_PIN = newPassword; // Update owner PIN
    }

    saveData(); // Save to LocalStorage
    alert("Password changed successfully.");
    closeModal();
}
