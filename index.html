<script>

/* =====================================================
   SUPABASE & OFFLINE STORAGE LAYER
===================================================== */

const SUPABASE_URL = "https://efwzdzffdzklxrrssucz.supabase.co";
const SUPABASE_KEY = "sb_publishable_VgCDEcuwsgDXdTvFW2IJaw_RTMbY0ax";
const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let databaseReady = false;
let dbSyncBusy = false;
let uploadedImageBase64 = "";

function previewImage(event) {
    const file = event.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            const img = document.getElementById("imagePreview");
            img.src = e.target.result;
            img.style.display = "block";
            uploadedImageBase64 = e.target.result;
        };
        reader.readAsDataURL(file);
    }
}

function normalizeProduct(row){ 
    return {
        id: row.id,
        name: row.name || "",
        sku: row.sku || "",
        supplier: row.supplier || "",
        category: row.category || "",
        sizes: row.size || row.sizes || "",
        model: row.model || "",
        color: row.color || "",
        cost: Number(row.cost || 0),
        price: Number(row.price || 0),
        stock: Number(row.stock || 0),
        min: Number(row.minimum ?? row.min ?? 0),
        target: Number(row.target || 0),
        image: row.image || ""
    }; 
}
function normalizeTransaction(row){ let items=row.items; if(typeof items==="string"){try{items=JSON.parse(items)}catch{items=[]}} return {id:row.id,date:row.date||row.created_at||new Date().toISOString(),branch:row.branch||"",employee:row.employee||"",employeeId:row.employee_id ?? row.employeeId ?? "",items:Array.isArray(items)?items:[],total:Number(row.total||0),profit:Number(row.profit||0)}; }
function normalizeEmployee(row){ return {
    id:row.id,
    name:row.name||"",
    username:row.username||"",
    employeeId:row.employee_id ?? row.employeeId ?? "",
    branch:row.branch||"Main Branch",
    position:row.position||"Employee",
    status:row.status||"Active",
    password:row.password||"",
    mustChangePassword:!!row.must_change_password||!!row.mustChangePassword,
    contact:row.contact_number||row.contact||row.contactNumber||"",
    dateHired:row.date_hired||row.dateHired||"",
    notes:row.notes||"",
    deactivatedAt:row.deactivated_at||row.deactivatedAt||null,
    deactivationReason:row.deactivation_reason||row.deactivationReason||""
}; }
function normalizeSupplier(row){ return {id:row.id,name:row.name||"",contact:row.contact||""}; }
function normalizeCash(row){ return {id:row.id,date:row.date||row.created_at||new Date().toISOString(),branch:row.branch||"",amount:Number(row.amount||0),collectedBy:row.collected_by ?? row.collectedBy ?? "",purpose:row.purpose||""}; }
function normalizeAudit(row){ let items=row.products ?? row.items ?? []; if(typeof items==="string"){try{items=JSON.parse(items)}catch{items=[]}} return {id:row.id,date:row.date||row.created_at||new Date().toISOString(),branch:row.branch||"",employee:row.employee||"",employeeId:row.employee_id ?? row.employeeId ?? "",products:Array.isArray(items)?items:[]}; }

// LocalStorage Persistence Helpers
function saveLocalData(){
    try {
        localStorage.setItem("motorShop_products", JSON.stringify(products));
        localStorage.setItem("motorShop_transactions", JSON.stringify(transactions));
        localStorage.setItem("motorShop_employees", JSON.stringify(employees));
        localStorage.setItem("motorShop_suppliers", JSON.stringify(suppliers));
        localStorage.setItem("motorShop_cashCollections", JSON.stringify(cashCollections));
        localStorage.setItem("motorShop_audits", JSON.stringify(audits));
    } catch(e) { console.error("Local save error:", e); }
}

function loadLocalData(){
    try {
        const p = localStorage.getItem("motorShop_products");
        if(p) products = JSON.parse(p);
        const t = localStorage.getItem("motorShop_transactions");
        if(t) transactions = JSON.parse(t);
        const e = localStorage.getItem("motorShop_employees");
        if(e) employees = JSON.parse(e);
        const s = localStorage.getItem("motorShop_suppliers");
        if(s) suppliers = JSON.parse(s);
        const c = localStorage.getItem("motorShop_cashCollections");
        if(c) cashCollections = JSON.parse(c);
        const a = localStorage.getItem("motorShop_audits");
        if(a) audits = JSON.parse(a);
    } catch(e) { console.error("Local load error:", e); }
}

// Queue for offline actions waiting to sync
function getOfflineQueue(){
    try {
        const q = JSON.parse(localStorage.getItem("motorShop_offlineQueue") || "[]");
        return Array.isArray(q) ? q : [];
    } catch { return []; }
}
function saveOfflineQueue(q){
    localStorage.setItem("motorShop_offlineQueue", JSON.stringify(Array.isArray(q) ? q : []));
}
function makeQueueId(){
    return "Q-" + Date.now() + "-" + Math.random().toString(36).slice(2,10);
}
function enqueueOffline(type, data){
    const q = getOfflineQueue();
    const actionId = data?._syncActionId || makeQueueId();
    const clean = {...data};
    delete clean._syncActionId;
    if(!q.some(a => a.actionId === actionId)){
        q.push({actionId, type, data: clean, createdAt: new Date().toISOString(), attempts: 0});
        saveOfflineQueue(q);
    }
    return actionId;
}
function pendingQueueData(type){
    return getOfflineQueue().filter(a => a.type === type).map(a => a.data);
}

let lastSyncAt = null;
let lastSyncError = "";

function updateDbStatus(){
    const el = document.getElementById("dbStatusText");
    if(el) el.textContent = dbStatus();
}
function dbStatus(){
    const pending = getOfflineQueue().length;
    if(!navigator.onLine) return "🟡 Offline Mode • " + pending + " pending sync";
    if(!databaseReady) return "🟠 Database connection unavailable";
    return "🟢 Online database connected" + (pending ? " • " + pending + " pending" : "");
}
function mergePendingLocalData(){
    // Never let a failed/offline sale disappear just because a fresh server pull ran.
    const q = getOfflineQueue();
    const txPending = q.filter(a=>a.type==="process_sale").map(a=>normalizeTransaction(a.data));

    // Also preserve any locally known sale that is not currently returned by
    // Supabase. This is intentional: sales are audit records and must not be
    // silently deleted from the browser because of a temporary/incomplete read.
    const productPending = q.filter(a=>a.type==="insert_product").map(a=>normalizeProduct(a.data));
    const cashPending = q.filter(a=>a.type==="insert_cash").map(a=>normalizeCash(a.data));

    if(txPending.length){
        const ids = new Set(transactions.map(x=>String(x.id)));
        txPending.forEach(x=>{ if(!ids.has(String(x.id))) transactions.unshift(x); });
    }
    if(productPending.length){
        const ids = new Set(products.map(x=>String(x.id)));
        productPending.forEach(x=>{ if(!ids.has(String(x.id))) products.push(x); });
    }
    if(cashPending.length){
        const ids = new Set(cashCollections.map(x=>String(x.id)));
        cashPending.forEach(x=>{ if(!ids.has(String(x.id))) cashCollections.unshift(x); });
    }
}

async function processOfflineQueue(){
    if(!navigator.onLine || !databaseReady) return;
    const queue = getOfflineQueue();
    if(!queue.length) return;

    const remaining = [];
    for(const action of queue){
        try{
            let result;
            if(action.type === "insert_product"){
                result = await _supabase.from("products").upsert(action.data, {onConflict:"id", ignoreDuplicates:true});
            } else if(action.type === "process_sale"){
                result = await _supabase.rpc("process_sale", {p_transaction: action.data});
                // A successful RPC is enough to remove the queue item; the
                // transaction itself remains in the local history as an audit record.
            } else if(action.type === "insert_cash"){
                result = await _supabase.from("cash_collections").upsert(action.data, {onConflict:"id", ignoreDuplicates:true});
            } else if(action.type === "update_product_stock"){
                result = await _supabase.from("products").update({stock: action.data.stock}).eq("id", action.data.id);
            } else {
                continue;
            }
            if(result?.error) throw result.error;
        }catch(err){
            action.attempts = Number(action.attempts || 0) + 1;
            action.lastError = err?.message || String(err);
            remaining.push(action);
        }
    }
    saveOfflineQueue(remaining);
    updateDbStatus();
}

async function syncAllFromSupabase(initial=false){
    if(dbSyncBusy) return;
    if(!navigator.onLine){
        databaseReady = false;
        loadLocalData();
        mergePendingLocalData();
        updateDbStatus();
        return false;
    }

    dbSyncBusy=true;
    try{
        await processOfflineQueue();

        const [p,t,e,sup,c,a,catData,szData,mdData,colData]=await Promise.all([
            _supabase.from("products").select("*").order("id"),
            _supabase.from("transactions").select("*").order("date",{ascending:false}),
            _supabase.from("employees").select("*").order("id"),
            _supabase.from("suppliers").select("*").order("id"),
            _supabase.from("cash_collections").select("*").order("date",{ascending:false}),
            _supabase.from("inventory_audits").select("*").order("date",{ascending:false}),
            _supabase.from("shop_categories").select("*").order("id"),
            _supabase.from("shop_sizes").select("*").order("id"),
            _supabase.from("shop_models").select("*").order("id"),
            _supabase.from("shop_colors").select("*").order("id")
        ]);

        const errors=[p,t,e,sup,c,a,catData,szData,mdData,colData].filter(x=>x.error);
        if(errors.length) throw new Error(errors.map(x=>x.error.message).join(" | "));

        if(p.data) products=p.data.length?p.data.map(normalizeProduct):products;
        // SALES SAFETY: never replace the browser's complete sales history with
        // an empty/partial Supabase response. Merge by transaction ID instead.
        // This protects yesterday's sales when RLS, connection, or a temporary
        // Supabase read issue returns no rows or only part of the history.
        if(Array.isArray(t.data)){
            const serverTx = t.data.map(normalizeTransaction);
            const byId = new Map();
            [...transactions, ...serverTx].forEach(row=>{
                if(row && row.id!=null) byId.set(String(row.id), row);
            });
            transactions = Array.from(byId.values()).sort(
                (a,b)=>new Date(b.date||0)-new Date(a.date||0)
            );
        }
        if(e.data) employees=e.data.length?e.data.map(normalizeEmployee):employees;
        if(e.data){ const ownerRow=e.data.find(row=>String(row.employee_id||row.employeeId||"").toUpperCase()==="OWNER-001" && String(row.status||"Active")==="Active"); if(ownerRow && ownerRow.password){ ownerCredentials={username:ownerRow.name||ownerCredentials.username,password:String(ownerRow.password)}; localStorage.setItem("motorShop_ownerCredentials",JSON.stringify(ownerCredentials)); } }
        if(sup.data) suppliers=sup.data.length?sup.data.map(normalizeSupplier):suppliers;
        if(c.data) cashCollections=c.data.map(normalizeCash);
        if(a.data) audits=a.data.map(normalizeAudit);
        if(catData.data && catData.data.length) shopCategories = catData.data.map(x => x.name);
        if(szData.data && szData.data.length) {
            shopSizes = {};
            szData.data.forEach(row => {
                if(!shopSizes[row.category]) shopSizes[row.category] = [];
                shopSizes[row.category].push(row.size_name);
            });
        }
        if(mdData.data && mdData.data.length) shopModels = mdData.data.map(x => x.name);
        if(colData.data && colData.data.length) shopColors = colData.data.map(x => x.name);

        mergePendingLocalData();
        databaseReady = true;
        lastSyncAt = new Date();
        lastSyncError = "";
        saveLocalData();
        updateDbStatus();
        return true;
    }catch(err){
        databaseReady = false;
        lastSyncError = err?.message || String(err);
        mergePendingLocalData();
        updateDbStatus();
        throw err;
    }finally{
        dbSyncBusy=false;
    }
}

const dbReady=(async()=>{
    loadLocalData();
    try{
        await syncAllFromSupabase(true);
        databaseReady=true;
        startDatabaseSync();
        checkExistingSession();
    }catch(err){
        console.warn("Supabase offline mode:",err);
        databaseReady=false;
        mergePendingLocalData();
        startDatabaseSync();
        checkExistingSession();
        updateDbStatus();
    }
})();

function startDatabaseSync(){
    // Prevent overlapping 5-second pulls; the guard in syncAllFromSupabase is retained as a second safety net.
    setInterval(()=>{
        if(navigator.onLine && !dbSyncBusy) syncAllFromSupabase(false).catch(console.warn);
    },5000);

    window.addEventListener("online", ()=>{
        databaseReady = true;
        updateDbStatus();
        syncAllFromSupabase(false).catch(console.warn);
    });
    window.addEventListener("offline", ()=>{
        databaseReady = false;
        mergePendingLocalData();
        saveLocalData();
        updateDbStatus();
    });
    updateDbStatus();
}

/* =====================================================
   HELPERS
===================================================== */

function money(value){

    return "₱" + Number(value || 0)
        .toLocaleString("en-PH",{
            minimumFractionDigits:2,
            maximumFractionDigits:2
        });

}


function todayString(){

    return new Date().toLocaleDateString("en-US",{
        weekday:"long",
        year:"numeric",
        month:"long",
        day:"numeric"
    });

}


function isToday(date){

    const d = new Date(date);
    const n = new Date();

    return d.getDate()===n.getDate()
        && d.getMonth()===n.getMonth()
        && d.getFullYear()===n.getFullYear();

}


function todayTransactions(){

    return transactions.filter(t=>isToday(t.date));

}


function totalTodaySales(){

    return todayTransactions()
        .reduce((sum,t)=>sum+Number(t.total),0);

}


function totalTodayProfit(){

    return todayTransactions()
        .reduce((sum,t)=>sum+Number(t.profit),0);

}


function totalTodayTransactions(){

    return todayTransactions().length;

}


function totalTodayCollected(){

    return cashCollections
        .filter(c=>isToday(c.date))
        .reduce((sum,c)=>sum+Number(c.amount),0);

}


function lowStockProducts(){

    return products.filter(p=>p.stock<=p.min);

}


function employeeSales(employeeId){

    return todayTransactions()
        .filter(t=>t.employeeId===employeeId)
        .reduce((sum,t)=>sum+Number(t.total),0);

}


function employeeTransactionCount(employeeId){

    return todayTransactions()
        .filter(t=>t.employeeId===employeeId)
        .length;

}


function branchSales(branch){

    return todayTransactions()
        .filter(t=>t.branch===branch)
        .reduce((sum,t)=>sum+Number(t.total),0);

}


function branchTransactionCount(branch){

    return todayTransactions()
        .filter(t=>t.branch===branch)
        .length;

}

async function login(){
    const btn=document.getElementById("loginBtn");
    const name=document.getElementById("loginName").value.trim();
    const password=document.getElementById("loginPassword").value;
    if(!name || !password){ alert("Please enter your username and password."); return; }
    if(btn){btn.disabled=true;btn.textContent="LOGGING IN…";}
    try{
        const ownerMatch=name.toLowerCase()===String(ownerCredentials.username).toLowerCase() && password===String(ownerCredentials.password);
        const employee=employees.find(e=>e.status==="Active" && String(e.employeeId||"").toLowerCase()===name.toLowerCase() && String(e.password||"")===password);
        if(ownerMatch) currentUser={role:"owner",name:ownerCredentials.username,id:"OWNER-001",branch:"Main Branch",position:"Owner"};
        else if(employee) currentUser={role:"employee",name:employee.name,id:employee.employeeId,branch:employee.branch,position:employee.position};
        else { alert("Login failed. Incorrect username/Employee ID or password."); return; }
        sessionStorage.setItem("motorShopUser",JSON.stringify(currentUser));
        document.getElementById("loginScreen").style.display="none"; document.getElementById("app").classList.add("show");
        setupHeader(); renderDashboard();
    } finally { if(btn){btn.disabled=false;btn.textContent="LOGIN";} }
}

function checkExistingSession(){
    const savedUser = sessionStorage.getItem("motorShopUser");
    if(savedUser){
        try{
            currentUser = JSON.parse(savedUser);
            if(currentUser){
                document.getElementById("loginScreen").style.display="none";
                document.getElementById("app").classList.add("show");
                setupHeader(); renderDashboard();
            }
        }catch(e){
            console.error("Session load error:", e);
        }
    }
}

function showProductSuggestions(inputId,suggestionId){

    const q=input.value.trim().toLowerCase();

function selectPOSProduct(productId){

    const product=products.find(p=>p.id===productId);

    if(!product) return;

    if(product.stock<=0){

        alert("This product is out of stock.");

        return;

    }


    const existing=card.find(i=>i.productId===productId);

    if(existing){

        if(existing.qty>=product.stock){

            alert("Not enough stock.");

            return;

        }

        existing.qty++;

    }else{

        card.push({
            productId:product.id,
            name:product.name,
            price:product.price,
            cost:product.cost,
            qty:1
        });

    }


    const input=document.getElementById("posSearch");

    if(input) input.value="";

    const box=document.getElementById("posSuggestions");

    if(box) box.innerHTML="";

    renderCart();

}


function renderCart(){

    const area=document.getElementById("cartArea");

    if(!area) return;

function changeCartQty(index,change){

    const item=card[index];

    const product=products.find(
        p=>p.id===item.productId
    );

    item.qty+=change;


    if(item.qty<=0){

        card.splice(index,1);

    }


    if(product && item.qty>product.stock){

        item.qty=product.stock;

        alert("Maximum available stock reached.");

    }


    renderCart();

}


function removeCartItem(index){

    card.splice(index,1);

    renderCart();

}


async function completeSale(){
    if(!card.length){alert("Cart is empty.");return;}

    const saleCart=card.map(i=>({...i}));
    let total=0,profit=0;

    for(const item of saleCart){
        const p=products.find(x=>String(x.id)===String(item.productId));
        if(!p || Number(p.stock) < Number(item.qty)){
            alert("Insufficient stock for " + item.name);
            return;
        }
        total += Number(item.price) * Number(item.qty);
        profit += (Number(item.price) - Number(item.cost || 0)) * Number(item.qty);
        p.stock = Number(p.stock) - Number(item.qty);
    }

    // Keep employee IDs consistent (string) so Employee Sales and Owner reports match.
    const employeeId = String(currentUser?.employeeId ?? currentUser?.id ?? "");
    const tx = {
        id: "TX-" + Date.now() + "-" + Math.random().toString(36).slice(2,7),
        date: new Date().toISOString(),
        branch: currentUser?.branch || "Main Branch",
        employee: currentUser?.name || "",
        employeeId,
        items: saleCart,
        total,
        profit
    };

    // Save locally FIRST. This makes the sale immediately visible to Employee Sales
    // and the Owner's Today's Sales even when Supabase is unavailable.
    transactions = Array.isArray(transactions) ? transactions : [];
    transactions.unshift(tx);
    saveLocalData();

    let synced=false;
    if(navigator.onLine && databaseReady){
        try {
            const {error} = await _supabase.from("transactions").insert({
                id: tx.id,
                date: tx.date,
                branch: tx.branch,
                employee: tx.employee,
                employee_id: tx.employeeId,
                items: tx.items,
                total: tx.total,
                profit: tx.profit
            });
            if(error) throw error;
            synced=true;
        } catch(e){
            console.warn("Transaction sync failed; keeping sale in offline queue.", e);
        }
    }

    // Queue only when the online insert did not succeed.
    if(!synced){
        const q=getOfflineQueue();
        if(!q.some(a=>a.type==="insert_transaction" && a.data?.id===tx.id)){
            q.push({type:"insert_transaction",data:{
                id:tx.id,date:tx.date,branch:tx.branch,employee:tx.employee,
                employee_id:tx.employeeId,items:tx.items,total:tx.total,profit:tx.profit
            }});
            saveOfflineQueue(q);
        }
    }

    card=[];
    saveLocalData();
    renderCart();
    renderDashboard();
    alert("SALE COMPLETED\n\nTransaction: "+tx.id+"\nTotal: "+money(total)+(synced?"\nStatus: Synced":"\nStatus: Saved locally / queued for sync"));
}

/* =====================================================
   LIVE REAL-TIME CAMERA BARCODE SCANNER LOGIC (SIMPLIFIED VIDEO STREAM)
===================================================== */

async function startLiveCameraScanner() {
    if (!('BarcodeDetector' in window)) {
        alert("Ang iyong browser ay hindi sumusuporta sa Live BarcodeDetector API.");
        return;
    }

    showModal(
        "📷 Live Barcode Scanner",
        `
        <div style="text-align: center;">
            <video id="liveScannerVideo" autoplay playsinline style="width: 100%; max-height: 250px; background: #000; border-radius: 12px; object-fit: cover;"></video>
            <p style="margin-top: 10px; font-size: 12px; color: #6b7280;">Itapat lang ang camera sa barcode. Awtomatikong kukunin ang code at ilalagay sa SKU / Barcode field.</p>
        </div>
        `
    );

    try {
        const videoElement = document.getElementById("liveScannerVideo");
        
        // Use the rear camera on phones when available.
        activeCameraStream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: { ideal: "environment" },
                width: { ideal: 1280 },
                height: { ideal: 720 }
            },
            audio: false
        });

        videoElement.srcObject = activeCameraStream;
        isScanningLive = true;

        const barcodeDetector = new BarcodeDetector({
            formats: ['code_128', 'ean_13', 'ean_8', 'qr_code', 'upc_a', 'upc_e']
        });

        // Start scanning only after the camera has produced usable frames.
        await videoElement.play();

        const scanFrame = async () => {
            if (!isScanningLive) return;

            try {
                if (videoElement.readyState >= HTMLMediaElement.HAVE_ENOUGH_DATA) {
                    const barcodes = await barcodeDetector.detect(videoElement);

                    if (barcodes.length > 0 && barcodes[0].rawValue) {
                        const detectedCode = barcodes[0].rawValue.trim();
                        const skuField = document.getElementById('newSku');

                        if (skuField) {
                            // Barcode only: do NOT save the item automatically.
                            skuField.value = detectedCode;
                            skuField.dispatchEvent(new Event('input', { bubbles: true }));
                            skuField.focus();
                        }

                        stopLiveCameraScanner();
                        closeModal();
                        return;
                    }
                }
            } catch (err) {
                console.error("Scanning frame error:", err);
            }

            if (isScanningLive) {
                requestAnimationFrame(scanFrame);
            }
        };

        requestAnimationFrame(scanFrame);

    } catch (err) {
        console.error("Camera access error:", err);
        alert("Hindi mabuksan ang camera. Siguraduhing pinayagan ang pahintulot sa browser.");
        closeModal();
    }
}

function stopLiveCameraScanner() {
    isScanningLive = false;
    if (activeCameraStream) {
        activeCameraStream.getTracks().forEach(track => track.stop());
        activeCameraStream = null;
    }
}

async function addItem(){
    stopLiveCameraScanner();
    let name = document.getElementById("newName").value.trim();
    const sku = document.getElementById("newSku").value.trim();
    const category = document.getElementById("newCategory").value;
    const sizes = document.getElementById("newSizes").value;
    const model = document.getElementById("newModel").value;
    const color = document.getElementById("newColor").value;
    const supplier = document.getElementById("newSupplier").value;
    const cost = Number(document.getElementById("newCost").value) || 0;
    const price = Number(document.getElementById("newPrice").value) || 0;
    const stock = Number(document.getElementById("newStock").value) || 0;
    const min = Number(document.getElementById("newMin").value) || 0;
    const target = Number(document.getElementById("newTarget").value) || 0;
    const image = uploadedImageBase64;

    if(!name){
        name = (category ? category : "Item") + (sizes ? " " + sizes : "");
    }

    if(!sku){ alert("SKU is required."); return; } 

    const newProdObj = {
        id: Date.now(),
        name, sku, category, size: sizes, model, color, supplier, cost, price, stock, minimum: min, target, image
    };

    products.push(normalizeProduct(newProdObj));
    saveLocalData();

    if(navigator.onLine && databaseReady){
        try {
            const {error}=await _supabase.from("products").upsert(newProdObj,{onConflict:"id",ignoreDuplicates:true});
            if(error) throw error;
        } catch(e){
            console.warn("Failed saving item online, queued.", e);
            enqueueOffline("insert_product", newProdObj);
        }
    } else {
        enqueueOffline("insert_product", newProdObj);
    }
    
    alert("Item added successfully (Saved locally & synced online)."); 
    showSection("inventory");
}

        <button class="btn btn-green" style="width:100%; margin-top:10px;" onclick="saveEditedItem(${p.id})">UPDATE ITEM</button>
        `
    );
}

async function saveEditedItem(id){
    const name = document.getElementById("editName").value.trim();
    const sku = document.getElementById("editSku").value.trim();
    const category = document.getElementById("editCategory").value;
    const sizes = document.getElementById("editSizes").value;
    const model = document.getElementById("editModel").value;
    const color = document.getElementById("editColor").value;
    const cost = Number(document.getElementById("editCost").value) || 0;
    const price = Number(document.getElementById("editPrice").value) || 0;
    const min = Number(document.getElementById("editMin").value) || 0;
    const target = Number(document.getElementById("editTarget").value) || 0;

    if(!name || !sku){ alert("Name and SKU are required."); return; }

    const index = products.findIndex(x => x.id === id);
    if(index !== -1){
        products[index] = {...products[index], name, sku, category, sizes, model, color, cost, price, min, target};
        saveLocalData();
    }

    if(navigator.onLine && databaseReady){
        try {
            await _supabase.from("products").update({
                name, sku, category, size: sizes, model, color, cost, price, minimum: min, target
            }).eq("id", id);
        } catch(e){ console.warn("Could not update online:", e); }
    }

    closeModal();
    alert("Item updated successfully!");
    renderInventoryTable();
}

function confirmDeleteItem(id){
    const p = products.find(x => x.id === id);
    if(!p) return;

    showModal(
        "⚠️ Delete Item",
        `
        <div style="margin-bottom:15px; font-size:13px; color:#374151;">
            Are you sure you want to delete <strong>${p.name}</strong> (SKU: ${p.sku})? This action cannot be undone.
        </div>
        <div style="display:flex; gap:10px;">
            <button class="btn btn-gray" style="flex:1;" onclick="closeModal()">Cancel</button>
            <button class="btn btn-red" style="flex:1;" onclick="executeDeleteItem(${p.id})">Yes, Delete</button>
        </div>
        `
    );
}

async function executeDeleteItem(id){
    products = products.filter(x => x.id !== id);
    saveLocalData();

    if(navigator.onLine && databaseReady){
        try {
            await _supabase.from("products").delete().eq("id", id);
        } catch(e){ console.warn("Could not delete online:", e); }
    }

    closeModal();
    renderInventoryTable();
}

// Global HTML escape helper used by the Sales page.
// The later employee patch has its own scoped `esc()` helper,
// so renderSales() needs a global version here.
function esc(v){
    return String(v ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;");
}

function renderSales(){

    // Sales History filters
    const params = window._salesFilters || {};
    const txData = Array.isArray(transactions) ? transactions : [];
    const employeeData = Array.isArray(employees) ? employees : [];

    const allBranches = Array.from(new Set([
        "Main Branch",
        "Branch 2",
        ...employeeData.map(e=>e.branch).filter(Boolean),
        ...txData.map(t=>t.branch).filter(Boolean)
    ]));

    const selectedBranch = params.branch || "ALL";

    function sameSelectedDate(dateValue){
        if(!dateValue) return false;
        const d = new Date(dateValue);
        if(Number.isNaN(d.getTime())) return false;
        const y = d.getFullYear();
        const m = String(d.getMonth()+1).padStart(2,"0");
        const day = String(d.getDate()).padStart(2,"0");
        return `${y}-${m}-${day}`===selectedDate;
    }

    let list = txData.filter(t=>sameSelectedDate(t.date));

    if(currentUser.role==="employee"){
        list = list.filter(t=>String(t.employeeId)===String(currentUser.id));
    }

    if(selectedBranch!=="ALL"){
        list = list.filter(t=>String(t.branch)===String(selectedBranch));

    const discounts = list.reduce((s,t)=>s+Number(t.discount ?? 0),0);
    const net = list.reduce((s,t)=>s+Number(t.total ?? 0),0);

    let collections = collectionData.filter(c=>sameSelectedDate(c.date));
    if(selectedBranch!=="ALL"){
        collections = collections.filter(c=>String(c.branch)===String(selectedBranch));
    }
    const cashCollected = collections.reduce((s,c)=>s+Number(c.amount||0),0);
    const remaining = net-cashCollected;

    const branchOptions = currentUser.role==="employee"
        ? [currentUser.branch||"Main Branch"]

    const safeDate = String(selectedDate).replace(/"/g,"&quot;");

    document.getElementById("mainContent").innerHTML=`

                            : ""
                        }
                        ${branchOptions.map(b=>`

        </div>

        <div class="section-title">

/* =====================================================
   CASH COLLECTION
===================================================== */

function renderCash(){
    const branches = ["Main Branch","Branch 2"];
    const branch = document.getElementById("collectionBranch")?.value || branches[0];

    function branchCashSales(b){
        return todayTransactions()
            .filter(t=>t.branch===b)
            .reduce((sum,t)=>sum+Number(t.total||0),0);
    }
    function branchCashCollected(b){
        return cashCollections
            .filter(c=>isToday(c.date) && c.branch===b)
            .reduce((sum,c)=>sum+Number(c.amount||0),0);
    }
    function branchCashRemaining(b){
        // Intentionally NOT clamped: a negative value shows over-collection.
        return branchCashSales(b)-branchCashCollected(b);
    }

    const sales = branchCashSales(branch);
    const collected = branchCashCollected(branch);
    const remaining = branchCashRemaining(branch);
    const branchEmployees = employees.filter(e=>e.branch===branch && e.status==="Active");

    document.getElementById("mainContent").innerHTML=`
        <div class="section-title">💵 Cash Collection</div>

        <div class="card">
            <div class="muted">Daily cash control • ${branch}</div>
            <div class="summary-grid" style="margin-top:10px;">
                <div class="summary-card">
                    <div class="summary-title">Branch Sales Today</div>
                    <div class="summary-value">${money(sales)}</div>
                </div>
                <div class="summary-card">
                    <div class="summary-title">Cash Collected</div>
                    <div class="summary-value">${money(collected)}</div>
                </div>
                <div class="summary-card">
                    <div class="summary-title">Remaining / (Over)</div>
                    <div class="summary-value">${money(remaining)}</div>
                </div>
                <div class="summary-card">
                    <div class="summary-title">Status</div>
                    <div class="summary-value">${remaining<0?"OVER-COLLECTED":remaining===0?"CLEARED":"PENDING"}</div>
                </div>
            </div>
        </div>

        <div class="section-title">📋 Employee Cash Summary</div>
        ${branchEmployees.length ? branchEmployees.map(e=>{
            const esales = employeeSales(e.employeeId);
            const ecash = cashCollections.filter(c=>isToday(c.date) && c.branch===branch &&
                String(c.purpose||"").includes("[EMP:"+String(e.employeeId)+"]"))
                .reduce((sum,c)=>sum+Number(c.amount||0),0);
            const eleft = esales-ecash;
            return `<div class="card">
                <div class="row">
                    <strong>${esc(e.name)}</strong>
                    <strong>${money(eleft)}</strong>
                </div>
                <div class="muted">Sales: ${money(esales)} • Recorded collections: ${money(ecash)}</div>
                <div class="muted">${eleft<0?"Over-collected":eleft===0?"Cleared":"Cash still to collect"}</div>
            </div>`;
        }).join("") : `<div class="card">No active employees assigned to this branch.</div>`}

        <div class="section-title">➕ Record Owner Collection</div>
        <div class="form-card">
            <div class="input-group">
                <label>Branch</label>
                <select id="collectionBranch" onchange="renderCash()">
                    ${branches.map(b=>`<option ${b===branch?"selected":""}>${b}</option>`).join("")}
                </select>
            </div>
            <div class="input-group">
                <label>Collected From Employee</label>

                    <option value="">Branch-level / multiple employees</option>

                </div>
                <div class="muted">${new Date(c.date).toLocaleString()} • Recorded by ${esc(c.collectedBy)}</div>
                <div class="muted">${esc(c.purpose)}</div>
            </div>
        `).join("") : `<div class="card">No cash collections recorded yet.</div>`}
    `;
}

async function recordCashCollection(){
    if(currentUser?.role!=="owner"){
        alert("Only the Owner can record a cash collection.");
        return;
    }

    const branch=document.getElementById("collectionBranch")?.value||"Main Branch";
    const employeeId=document.getElementById("collectionEmployee")?.value||"";
    const amount=Number(document.getElementById("collectionAmount")?.value);
    const note=(document.getElementById("collectionPurpose")?.value||"Branch cash collection").trim();
    const pin=document.getElementById("collectionPin")?.value||"";

    if(!Number.isFinite(amount)||amount<=0){alert("Enter a valid amount.");return;}
    if(pin!==String(ownerCredentials.password)){alert("❌ Incorrect Owner PIN.\n\nCash collection was NOT recorded.");return;}

    const employee=employees.find(e=>String(e.employeeId)===String(employeeId));
    const employeeTag=employee ? ` [EMP:${employee.employeeId}] ${employee.name}` : " [EMP:BRANCH]";

    const cashObj={
        id:Date.now(),
        date:new Date().toISOString(),
        branch,
        amount,
        collectedBy:currentUser.name,
        purpose:note+employeeTag
    };

    cashCollections.unshift(normalizeCash(cashObj));
    saveLocalData();

    let synced=false;
    if(navigator.onLine && databaseReady){
        try{
            const {error}=await _supabase.from("cash_collections").upsert({
                id:cashObj.id,
                date:cashObj.date,
                branch:cashObj.branch,
                amount:cashObj.amount,
                collected_by:cashObj.collectedBy,
                purpose:cashObj.purpose
            },{onConflict:"id",ignoreDuplicates:true});
            if(error) throw error;
            synced=true;
        }catch(e){
            enqueueOffline("insert_cash",cashObj);
        }
    }else{
        enqueueOffline("insert_cash",cashObj);
    }

    const branchSales=todayTransactions().filter(t=>t.branch===branch).reduce((a,t)=>a+Number(t.total||0),0);
    const branchCollected=cashCollections.filter(c=>isToday(c.date)&&c.branch===branch).reduce((a,c)=>a+Number(c.amount||0),0);
    const remaining=branchSales-branchCollected;

    alert(
        "✅ CASH COLLECTION RECORDED\n\n"+
        "Branch: "+branch+"\n"+
        (employee ? "Collected From: "+employee.name+"\n" : "")+
        "Amount: "+money(amount)+"\n"+
        "Remaining / (Over): "+money(remaining)+
        (synced ? "\nStatus: Synced" : "\nStatus: Saved locally / queued for sync")
    );
    showSection("cash");
}

async function saveEmployeeOwnPassword(){
    if(currentUser?.role!=="employee") return;
    const e=employees.find(x=>String(x.employeeId)===String(currentUser.id));
    if(!e) return;

    const oldP=document.getElementById("empOldPassword")?.value||"";
    const newP=document.getElementById("empNewPassword")?.value||"";

/* =====================================================

let lastLowStockSignature = "";
let stockNotificationTimer = null;

function getLowStockItemsForNotification(){
    try {
        return typeof lowStockProducts === "function" ? lowStockProducts() : (Array.isArray(products) ? products.filter(p => Number(p.stock) <= Number(p.min)) : []);
    } catch(e){
        return [];
    }
}

function showStockNotification(items){
    const box=document.getElementById("stockNotification");
    const text=document.getElementById("stockNotificationText");
    if(!box || !text) return;
    const count=items.length;
    const names=items.slice(0,3).map(p=>p.name).join(", ");
    text.textContent = count === 1 ? `${names} is low on stock.` : `${count} items are low on stock${names ? `: ${names}${count>3 ? "…" : ""}` : "."}`;
    box.classList.add("show");
    clearTimeout(stockNotificationTimer);
    stockNotificationTimer=setTimeout(()=>box.classList.remove("show"),10000);
}

function hideStockNotification(){
    const box=document.getElementById("stockNotification");
    if(box) box.classList.remove("show");
}

async function checkLowStockNotification(force=false){
    const items=getLowStockItemsForNotification();
    const signature=items.map(p=>`${p.id||p.sku}:${p.stock}:${p.min}`).sort().join("|");
    if(!items.length){ lastLowStockSignature=""; hideStockNotification(); return; }
    if(!force && signature===lastLowStockSignature) return;
    lastLowStockSignature=signature;
    showStockNotification(items);
    if("Notification" in window){
        try {
            if(Notification.permission === "granted") new Notification("Motor Shop — Low Stock", {body:`${items.length} item(s) need restocking.`});
        } catch(e){}
    }
}

function requestLowStockNotifications(){
    if("Notification" in window && Notification.permission === "default") Notification.requestPermission().catch(()=>{});
}

        alert('Login failed. Incorrect username/Employee ID or password.');return;
      }
      sessionStorage.setItem('motorShopUser',JSON.stringify(currentUser));document.getElementById('loginScreen').style.display='none';document.getElementById('app').classList.add('show');setupHeader();renderDashboard();
    }catch(err){console.error(err);alert('Login error: '+(err?.message||err));}
    finally{if(btn){btn.disabled=false;btn.textContent='LOGIN';}}
  };
  /* Employee POS: availability-safe suggestions + payment/change + customer + discount + hold/resume + receipt */
  const originalSuggestions=showProductSuggestions;
  window.showProductSuggestions=function(inputId,suggestionId){const input=document.getElementById(inputId),box=document.getElementById(suggestionId);if(!input||!box)return;const q=input.value.trim().toLowerCase();if(!q){box.innerHTML='';return}const matches=products.filter(p=>p.name.toLowerCase().includes(q)||p.sku.toLowerCase().includes(q));box.innerHTML=matches.map(p=>`<div class="suggestion" onclick="selectPOSProduct(${p.id})"><strong>${esc(p.name)}</strong><small>SKU: ${esc(p.sku)} • ${currentUser&&currentUser.role==='employee'?status(p):'Stock: '+p.stock}</small></div>`).join('')};
  window.renderPOS=function(){document.getElementById('mainContent').innerHTML=`<div class="section-title">🛒 Point of Sale</div><div class="form-card"><div class="input-group"><label>Search Product / SKU / Barcode</label><div class="autocomplete"><input id="posSearch" placeholder="Type or scan barcode" oninput="showProductSuggestions('posSearch','posSuggestions')"><div class="suggestions" id="posSuggestions"></div></div></div><div class="two-col"><div class="input-group"><label>Customer Name (optional)</label><input id="customerName"></div><div class="input-group"><label>Customer Contact (optional)</label><input id="customerContact"></div></div><div class="two-col"><div class="input-group"><label>Discount</label><input id="saleDiscount" type="number" min="0" value="0"></div><div class="input-group"><label>Payment Received</label><input id="paymentReceived" type="number" min="0" placeholder="₱0.00"></div></div><div class="muted">Discounts are recorded with the sale. Final change is calculated before completing.</div></div><div class="section-title">🛒 Cart</div><div id="cartArea"></div><div style="display:flex;gap:8px"><button class="btn btn-gray" style="flex:1" onclick="holdCurrentCart()">HOLD CART</button><button class="btn btn-blue" style="flex:1" onclick="showHeldCarts()">RESUME CART</button></div>`;renderCart();setBottomNav([{icon:'🏠',name:'Dashboard',action:"showSection('dashboard')"},{icon:'🛒',name:'POS',action:"showSection('pos')"},{icon:'📦',name:'Stock',action:"showSection('stock')"},{icon:'🧾',name:'Transactions',action:"showSection('transactions')"}])};
  window.holdCurrentCart=function(){if(!card.length){alert('Cart is empty.');return}const held=JSON.parse(localStorage.getItem('motorShop_heldCarts')||'[]');held.push({id:Date.now(),date:new Date().toISOString(),employeeId:currentUser.id,items:card,customerName:document.getElementById('customerName')?.value||'',customerContact:document.getElementById('customerContact')?.value||'',discount:Number(document.getElementById('saleDiscount')?.value||0)});localStorage.setItem('motorShop_heldCarts',JSON.stringify(held));card=[];alert('Cart held.');renderCart()};
  window.showHeldCarts=function(){const held=JSON.parse(localStorage.getItem('motorShop_heldCarts')||'[]').filter(x=>x.employeeId===currentUser.id);showModal('⏸️ Held Carts',held.length?held.map(h=>`<div class="card"><strong>${esc(h.customerName||'Walk-in')}</strong><div class="muted">${h.items.length} item(s) • ${new Date(h.date).toLocaleString()}</div><button class="btn btn-blue" onclick="resumeHeldCart(${h.id})">RESUME</button></div>`).join(''):'<div class="card">No held carts.</div>')};
  window.resumeHeldCart=function(id){const all=JSON.parse(localStorage.getItem('motorShop_heldCarts')||'[]'),h=all.find(x=>x.id===id);if(!h)return;card=h.items;localStorage.setItem('motorShop_heldCarts',JSON.stringify(all.filter(x=>x.id!==id)));closeModal();renderPOS();document.getElementById('customerName').value=h.customerName||'';document.getElementById('customerContact').value=h.customerContact||'';document.getElementById('saleDiscount').value=h.discount||0;renderCart()};
  /*
   * V4.6 Sync-safe POS:
   * - One transaction ID is generated once and reused for retries.
   * - Online sales go through Supabase RPC process_sale(), which atomically
   *   validates stock, deducts stock, and inserts the transaction.
   * - Offline sales are stored locally and queued; reconnect retries the same ID.
   */
  window.completeSale=async function(){
    if(!card.length){alert('Cart is empty.');return}

    let subtotal=card.reduce((s,i)=>s+Number(i.price)*Number(i.qty),0);
    let discount=Math.max(0,Number(document.getElementById('saleDiscount')?.value||0));
    discount=Math.min(discount,subtotal);
    const total=subtotal-discount;
    const pay=Number(document.getElementById('paymentReceived')?.value||0);

    if(pay<total){
      alert('Payment is not enough. Total: '+money(total));
      return;
    }

    // Local pre-check improves UX; the server RPC is the final authority when online.
    for(const item of card){
      const p=products.find(x=>String(x.id)===String(item.productId));
      if(!p || Number(p.stock)<Number(item.qty)){
        alert('Insufficient stock for '+item.name);
        return;
      }
    }

    const saleCart=card.map(i=>({...i}));
    let profit=0;
    saleCart.forEach(i=>{
      const p=products.find(x=>String(x.id)===String(i.productId));
      profit+=(Number(i.price)-Number(i.cost||0))*Number(i.qty);
    });
    profit-=discount;

    const tx={
      id:'TX-'+Date.now()+'-'+Math.random().toString(36).slice(2,8),
      date:new Date().toISOString(),
      branch:currentUser?.branch||'Main Branch',
      employee:currentUser?.name||'',
      employeeId:String(currentUser?.id||currentUser?.employeeId||''),
      items:saleCart,
      total,
      subtotal,
      discount,
      profit,
      customerName:document.getElementById('customerName')?.value||'',
      customerContact:document.getElementById('customerContact')?.value||'',
      payment:pay,
      change:pay-total
    };

    // Display immediately and keep it locally until the server confirms it.
    transactions=Array.isArray(transactions)?transactions:[];
    transactions.unshift(tx);
    saveLocalData();

    let synced=false;
    if(navigator.onLine && databaseReady){
      try{
        const {error}=await _supabase.rpc('process_sale',{
          p_transaction:{
            id:tx.id,
            date:tx.date,
            branch:tx.branch,
            employee:tx.employee,
            employee_id:tx.employeeId,
            items:tx.items,
            total:tx.total,
            profit:tx.profit
          }
        });
        if(error) throw error;

        // Server has committed the sale. Update this browser's stock locally.
        saleCart.forEach(i=>{
          const p=products.find(x=>String(x.id)===String(i.productId));
          if(p) p.stock=Number(p.stock)-Number(i.qty);
        });
        saveLocalData();
        synced=true;
      }catch(err){
        console.warn('Sale sync failed; queued for retry.',err);
      }
    }

    if(!synced){
      enqueueOffline('process_sale',{
        id:tx.id,
        date:tx.date,
        branch:tx.branch,
        employee:tx.employee,
        employee_id:tx.employeeId,
        items:tx.items,
        total:tx.total,
        profit:tx.profit
      });
      updateDbStatus();
    }

    card=[];
    saveLocalData();
    alert('SALE COMPLETED\nTransaction: '+tx.id+'\nTotal: '+money(total)+'\nChange: '+money(tx.change)+(synced?'\nStatus: Synced':'\nStatus: Saved locally / queued for sync'));
    showReceipt(tx);
  };

  window.showReceipt=function(tx){showModal('🧾 Receipt Preview',`<div class="card" id="receiptBox"><strong>MOTOR SHOP</strong><hr><div>Transaction: ${esc(tx.id)}</div><div>Date: ${new Date(tx.date).toLocaleString()}</div><div>Customer: ${esc(tx.customerName||'Walk-in')}</div><hr>${tx.items.map(i=>`<div class="row"><span>${esc(i.name)} × ${i.qty}</span><strong>${money(i.price*i.qty)}</strong></div>`).join('')}<hr><div class="row"><strong>Subtotal</strong><strong>${money(tx.subtotal)}</strong></div><div class="row"><strong>Discount</strong><strong>${money(tx.discount)}</strong></div><div class="row"><strong>TOTAL</strong><strong>${money(tx.total)}</strong></div><div class="row"><span>Payment</span><strong>${money(tx.payment)}</strong></div><div class="row"><span>Change</span><strong>${money(tx.change)}</strong></div></div><button class="btn btn-dark" style="width:100%" onclick="window.print()">🖨️ PRINT RECEIPT</button>`)};

  window.openSalesSafe=function(){
    if(!currentUser){ alert('Please log in first.'); return; }
    if(currentUser.role!=='owner'){
      if(typeof renderEmployeeTransactions==='function') renderEmployeeTransactions();
      return;
    }
    try{
      if(typeof stopLiveCameraScanner==='function') stopLiveCameraScanner();
      const menu=document.getElementById('profileMenu');
      if(menu) menu.classList.remove('show');
      if(typeof renderSales!=='function'){
        alert('Sales module is not loaded. Please reopen the updated Motor Shop file.');
        return;
      }
      renderSales();
    }catch(err){
      console.error('Sales page error:',err);
      const main=document.getElementById('mainContent');
      if(main){
        main.innerHTML='<div class="section-title">💰 Sales</div><div class="card"><strong>Sales is temporarily unavailable.</strong><div class="muted" style="margin-top:8px">Please try opening Sales again. Your sales data has not been deleted.</div><button class="btn btn-dark" style="margin-top:12px" onclick="window.openSalesSafe()">OPEN SALES AGAIN</button></div>';
      }else{
        alert('Sales could not be opened. Please reopen the updated Motor Shop file.');
      }
    }
  };

  window.showSection=function(section){if(!currentUser)return;stopLiveCameraScanner();document.getElementById('profileMenu')?.classList.remove('show');if(currentUser.role==='owner'){if(section==='dashboard')renderDashboard();if(section==='inventory')renderInventory();if(section==='addItem')renderAddItem();if(section==='restock')renderRestock();if(section==='sales')openSalesSafe();if(section==='cash')renderCash();if(section==='employees')renderEmployees();if(section==='suppliers')renderSuppliers();if(section==='audit')renderAudits();if(section==='reports')renderReports()}else{if(section==='dashboard')renderDashboard();if(section==='pos')renderPOS();if(section==='stock')renderEmployeeStock();if(section==='transactions')renderEmployeeTransactions()}};
  window.setInterval(function(){if(currentUser&&currentUser.role==='employee'){const e=employees.find(x=>String(x.employeeId)===String(currentUser.id));if(!e||e.status!=='Active'){sessionStorage.removeItem('motorShopUser');currentUser=null;document.getElementById('app').classList.remove('show');document.getElementById('loginScreen').style.display='flex';alert('Your employee account is inactive. Please contact the Owner.')}}},3000);
})();
</script>

<script>
/* =====================================================
   REPORTS + INVENTORY DASHBOARD UPDATE
   Built on the working Sales flow; checkout is unchanged.
===================================================== */
(function(){
  const moneySafe = v => typeof money === 'function'
    ? money(Number(v)||0)
    : '₱'+(Number(v)||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
  const escSafe = v => String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

  function dateOnly(v){
    const d=new Date(v);
    return Number.isNaN(d.getTime()) ? '' :
      `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  function txList(){
    let list=Array.isArray(transactions)?transactions:[];

      list=list.filter(t=>String(t.employeeId)===String(currentUser.id));
    }
    return list;
  }

  window.renderReports=function(){
    const all=txList();
    const today=dateOnly(new Date());
    const month=today.slice(0,7);
    const todayTx=all.filter(t=>dateOnly(t.date)===today);
    const monthTx=all.filter(t=>dateOnly(t.date).startsWith(month));

    const totalSales=all.reduce((s,t)=>s+Number(t.total||0),0);
    const totalProfit=all.reduce((s,t)=>s+Number(t.profit||0),0);
    const itemsSold=all.reduce((s,t)=>s+(Array.isArray(t.items)?t.items.reduce((a,i)=>a+Number(i.qty||0),0):0),0);

    const productMap={};
    all.forEach(t=>(t.items||[]).forEach(i=>{
      const k=String(i.productId??i.sku??i.name);
      if(!productMap[k]) productMap[k]={name:i.name||'Unknown',sku:i.sku||'',qty:0,sales:0};
      productMap[k].qty+=Number(i.qty||0);
      productMap[k].sales+=Number(i.price||0)*Number(i.qty||0);
    }));
    const topProducts=Object.values(productMap).sort((a,b)=>b.qty-a.qty).slice(0,10);

    const employeeMap={};
    all.forEach(t=>{
      const k=t.employeeId||t.employee||'Unknown';
      if(!employeeMap[k]) employeeMap[k]={name:t.employee||'Unknown',sales:0,profit:0,count:0};
      employeeMap[k].sales+=Number(t.total||0);
      employeeMap[k].profit+=Number(t.profit||0);
      employeeMap[k].count++;
    });

    document.getElementById('mainContent').innerHTML=`
      <div class="section-title">📊 Reports</div>
      <div class="card">
        <div class="muted">Sales overview</div>
        <div class="two-col" style="margin-top:10px">
          <div class="info-box"><small>Total Sales</small><strong>${moneySafe(totalSales)}</strong></div>
          <div class="info-box"><small>Total Profit</small><strong>${moneySafe(totalProfit)}</strong></div>
          <div class="info-box"><small>Transactions</small><strong>${all.length}</strong></div>
          <div class="info-box"><small>Items Sold</small><strong>${itemsSold}</strong></div>
          <div class="info-box"><small>Today's Sales</small><strong>${moneySafe(todayTx.reduce((s,t)=>s+Number(t.total||0),0))}</strong></div>
          <div class="info-box"><small>This Month</small><strong>${moneySafe(monthTx.reduce((s,t)=>s+Number(t.total||0),0))}</strong></div>
        </div>
      </div>

      <div class="section-title">🏆 Top Products</div>
      <div class="card table-wrap"><table>
        <thead><tr><th>Product</th><th>SKU</th><th>Qty Sold</th><th>Sales</th></tr></thead>
        <tbody>${topProducts.length ? topProducts.map(p=>`
          <tr><td>${escSafe(p.name)}</td><td>${escSafe(p.sku)}</td><td>${p.qty}</td><td>${moneySafe(p.sales)}</td></tr>
        `).join('') : '<tr><td colspan="4">No sales data yet.</td></tr>'}</tbody>
      </table></div>

      <div class="section-title">👥 Sales by Employee</div>
      <div class="card table-wrap"><table>
        <thead><tr><th>Employee</th><th>Transactions</th><th>Sales</th><th>Profit</th></tr></thead>
        <tbody>${Object.values(employeeMap).length ? Object.values(employeeMap).map(e=>`
          <tr><td>${escSafe(e.name)}</td><td>${e.count}</td><td>${moneySafe(e.sales)}</td><td>${moneySafe(e.profit)}</td></tr>
        `).join('') : '<tr><td colspan="4">No sales data yet.</td></tr>'}</tbody>
      </table></div>

      <div class="section-title">🧾 Recent Sales</div>
      <div class="card table-wrap"><table>
        <thead><tr><th>Date</th><th>Employee</th><th>Items</th><th>Total</th><th>Profit</th></tr></thead>
        <tbody>${all.slice(0,30).map(t=>`
          <tr>
            <td>${escSafe(new Date(t.date).toLocaleString())}</td>
            <td>${escSafe(t.employee||'')}</td>
            <td>${(t.items||[]).reduce((s,i)=>s+Number(i.qty||0),0)}</td>
            <td>${moneySafe(t.total)}</td>
            <td>${moneySafe(t.profit)}</td>
          </tr>
        `).join('') || '<tr><td colspan="5">No sales recorded.</td></tr>'}</tbody>
      </table></div>
    `;
    setBottomNav([
      {icon:"🏠",name:"Dashboard",action:"showSection('dashboard')"},
      {icon:"💰",name:"Sales",action:"showSection('sales')"},
      {icon:"📊",name:"Reports",action:"showSection('reports')"},
      {icon:"📦",name:"Inventory",action:"showSection('inventory')"}
    ]);
  };

  window.renderInventory=function(){
    const list=Array.isArray(products)?products:[];
    const low=list.filter(p=>Number(p.stock)<=Number(p.min));
    const out=list.filter(p=>Number(p.stock)<=0);
    const units=list.reduce((s,p)=>s+Number(p.stock||0),0);
    const costValue=list.reduce((s,p)=>s+Number(p.stock||0)*Number(p.cost||0),0);

    document.getElementById('mainContent').innerHTML=`
      <div class="section-title">📦 Inventory</div>
      <div class="card">
        <input id="inventorySearchNew" style="width:100%;padding:11px;border:1px solid #ddd;border-radius:10px"
          placeholder="Search product / SKU" oninput="window.filterInventoryNew()">
        <div class="two-col" style="margin-top:10px">
          <div class="info-box"><small>Products</small><strong>${list.length}</strong></div>
          <div class="info-box"><small>Units in Stock</small><strong>${units}</strong></div>
          <div class="info-box"><small>Low Stock</small><strong>${low.length}</strong></div>
          <div class="info-box"><small>Out of Stock</small><strong>${out.length}</strong></div>
          <div class="info-box"><small>Inventory Cost Value</small><strong>${moneySafe(costValue)}</strong></div>
        </div>

    window.filterInventoryNew();
    setBottomNav([
      {icon:"🏠",name:"Dashboard",action:"showSection('dashboard')"},
      {icon:"📦",name:"Inventory",action:"showSection('inventory')"},
      {icon:"➕",name:"Add Item",action:"showSection('addItem')"},
      {icon:"📥",name:"Restock",action:"showSection('restock')"}
    ]);
  };

  window.filterInventoryNew=function(){

    const list=(Array.isArray(products)?products:[]).filter(p=>
      String(p.name||'').toLowerCase().includes(q) ||

    el.innerHTML=`<div class="card table-wrap"><table>
      <thead><tr><th>Product</th><th>SKU</th><th>Cost</th><th>Price</th><th>Stock</th><th>Min</th><th>Status</th></tr></thead>

      }).join('') || '<tr><td colspan="7">No matching products.</td></tr>'}</tbody>
    </table></div>`;

      return window.renderReports();
    }
