<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =====================================================
   SUPABASE & OFFLINE STORAGE LAYER
===================================================== */

const SUPABASE_URL = "https://efwzdzffdzklxrrssucz.supabase.co";
const SUPABASE_KEY = "sb_publishable_VgCDEcuwsgDXdTvFW2IJaw_RTMbY0ax";
const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let databaseReady = false;
let dbSyncBusy = false;
let uploadedImageBase64 = "";

function previewImage(event) {
    const file = event.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            const img = document.getElementById("imagePreview");
            img.src = e.target.result;
            img.style.display = "block";
            uploadedImageBase64 = e.target.result;
        };
        reader.readAsDataURL(file);
    }
}

function normalizeProduct(row){ 
    return {
        id: row.id,
        name: row.name || "",
        sku: row.sku || "",
        supplier: row.supplier || "",
        category: row.category || "",
        sizes: row.size || row.sizes || "",
        model: row.model || "",
        color: row.color || "",
        cost: Number(row.cost || 0),
        price: Number(row.price || 0),
        stock: Number(row.stock || 0),
        min: Number(row.minimum ?? row.min ?? 0),
        target: Number(row.target || 0),
        image: row.image || ""
    }; 
}
function normalizeTransaction(row){ let items=row.items; if(typeof items==="string"){try{items=JSON.parse(items)}catch{items=[]}} return {id:row.id,date:row.date||row.created_at||new Date().toISOString(),branch:row.branch||"",employee:row.employee||"",employeeId:row.employee_id ?? row.employeeId ?? "",items:Array.isArray(items)?items:[],total:Number(row.total||0),profit:Number(row.profit||0)}; }
function normalizeEmployee(row){ return {id:row.id,name:row.name||"",employeeId:row.employee_id ?? row.employeeId ?? "",branch:row.branch||"Main Branch",position:row.position||"Employee",status:row.status||"Active",password:row.password||""}; }
function normalizeSupplier(row){ return {id:row.id,name:row.name||"",contact:row.contact||""}; }
function normalizeCash(row){ return {id:row.id,date:row.date||row.created_at||new Date().toISOString(),branch:row.branch||"",amount:Number(row.amount||0),collectedBy:row.collected_by ?? row.collectedBy ?? "",purpose:row.purpose||""}; }
function normalizeAudit(row){ let items=row.products ?? row.items ?? []; if(typeof items==="string"){try{items=JSON.parse(items)}catch{items=[]}} return {id:row.id,date:row.date||row.created_at||new Date().toISOString(),branch:row.branch||"",employee:row.employee||"",employeeId:row.employee_id ?? row.employeeId ?? "",products:Array.isArray(items)?items:[]}; }

// LocalStorage Persistence Helpers
function saveLocalData(){
    try {
        localStorage.setItem("motorShop_products", JSON.stringify(products));
        localStorage.setItem("motorShop_transactions", JSON.stringify(transactions));
        localStorage.setItem("motorShop_employees", JSON.stringify(employees));
        localStorage.setItem("motorShop_suppliers", JSON.stringify(suppliers));
        localStorage.setItem("motorShop_cashCollections", JSON.stringify(cashCollections));
        localStorage.setItem("motorShop_audits", JSON.stringify(audits));
    } catch(e) { console.error("Local save error:", e); }
}

function loadLocalData(){
    try {
        const p = localStorage.getItem("motorShop_products");
        if(p) products = JSON.parse(p);
        const t = localStorage.getItem("motorShop_transactions");
        if(t) transactions = JSON.parse(t);
        const e = localStorage.getItem("motorShop_employees");
        if(e) employees = JSON.parse(e);
        const s = localStorage.getItem("motorShop_suppliers");
        if(s) suppliers = JSON.parse(s);
        const c = localStorage.getItem("motorShop_cashCollections");
        if(c) cashCollections = JSON.parse(c);
        const a = localStorage.getItem("motorShop_audits");
        if(a) audits = JSON.parse(a);
    } catch(e) { console.error("Local load error:", e); }
}

// Queue for offline actions waiting to sync
function getOfflineQueue(){
    try {
        return JSON.parse(localStorage.getItem("motorShop_offlineQueue") || "[]");
    } catch{ return []; }
}
function saveOfflineQueue(q){
    localStorage.setItem("motorShop_offlineQueue", JSON.stringify(q));
}

async function processOfflineQueue(){
    if(!navigator.onLine || !databaseReady) return;
    const queue = getOfflineQueue();
    if(!queue.length) return;

    let remaining = [];
    for(let action of queue){
        try {
            if(action.type === "insert_product"){
                await _supabase.from("products").insert(action.data);
            } else if(action.type === "insert_transaction"){
                await _supabase.from("transactions").insert(action.data);
            } else if(action.type === "insert_cash"){
                await _supabase.from("cash_collections").insert(action.data);
            }
        } catch(err){
            console.warn("Queue sync failed for action:", action, err);
            remaining.push(action);
        }
    }
    saveOfflineQueue(remaining);
}

async function syncAllFromSupabase(initial=false){
    if(dbSyncBusy) return; 
    if(!navigator.onLine){
        databaseReady = false;
        loadLocalData();
        return;
    }
    dbSyncBusy=true;
    try{
        await processOfflineQueue();
        const [p,t,e,sup,c,a,catData,szData,mdData,colData]=await Promise.all([
            _supabase.from("products").select("*").order("id"),
            _supabase.from("transactions").select("*").order("date",{ascending:false}),
            _supabase.from("employees").select("*").order("id"),
            _supabase.from("suppliers").select("*").order("id"),
            _supabase.from("cash_collections").select("*").order("date",{ascending:false}),
            _supabase.from("inventory_audits").select("*").order("date",{ascending:false}),
            _supabase.from("shop_categories").select("*").order("id"),
            _supabase.from("shop_sizes").select("*").order("id"),
            _supabase.from("shop_models").select("*").order("id"),
            _supabase.from("shop_colors").select("*").order("id")
        ]);
        const errors=[p,t,e,sup,c,a].filter(x=>x.error);
        if(errors.length) throw new Error(errors.map(x=>x.error.message).join(" | "));
        if(p.data) products=p.data.length?p.data.map(normalizeProduct):products;
        if(t.data) transactions=t.data.map(normalizeTransaction);
        if(e.data) employees=e.data.length?e.data.map(normalizeEmployee):employees;
        if(sup.data) suppliers=sup.data.length?sup.data.map(normalizeSupplier):suppliers;
        if(c.data) cashCollections=c.data.map(normalizeCash);
        if(a.data) audits=a.data.map(normalizeAudit);
        if(catData.data && catData.data.length) shopCategories = catData.data.map(x => x.name);
        if(szData.data && szData.data.length) {
            shopSizes = {};
            szData.data.forEach(row => {
                if(!shopSizes[row.category]) shopSizes[row.category] = [];
                shopSizes[row.category].push(row.size_name);
            });
        }
        if(mdData.data && mdData.data.length) shopModels = mdData.data.map(x => x.name);
        if(colData.data && colData.data.length) shopColors = colData.data.map(x => x.name);
        
        databaseReady = true;
        saveLocalData();
        return true;
    }finally{ dbSyncBusy=false; }
}

const dbReady=(async()=>{
    loadLocalData();
    try{ await syncAllFromSupabase(true); databaseReady=true; startDatabaseSync(); checkExistingSession(); }
    catch(err){ console.warn("Supabase offline mode:",err); databaseReady=false; }
})();

function startDatabaseSync(){
    setInterval(()=>{ if(navigator.onLine) syncAllFromSupabase(false).catch(console.warn); },5000);
    window.addEventListener("online", ()=>{
        databaseReady = true;
        syncAllFromSupabase(false).catch(console.warn);
        const el = document.getElementById("dbStatusText");
        if(el) el.textContent = dbStatus();
    });
    window.addEventListener("offline", ()=>{
        databaseReady = false;
        const el = document.getElementById("dbStatusText");
        if(el) el.textContent = dbStatus();
    });
}

function dbStatus(){ 
    if(!navigator.onLine) return "🟡 Offline Mode (Saved locally, auto-syncs when online)";
    return databaseReady ? "🟢 Online database connected" : "🟠 Database connection unavailable"; 
}

/* =====================================================
   HELPERS
===================================================== */

function money(value){

    return "₱" + Number(value || 0)
        .toLocaleString("en-PH",{
            minimumFractionDigits:2,
            maximumFractionDigits:2
        });

}


function todayString(){

    return new Date().toLocaleDateString("en-US",{
        weekday:"long",
        year:"numeric",
        month:"long",
        day:"numeric"
    });

}


function isToday(date){

    const d = new Date(date);
    const n = new Date();

    return d.getDate()===n.getDate()
        && d.getMonth()===n.getMonth()
        && d.getFullYear()===n.getFullYear();

}


function todayTransactions(){

    return transactions.filter(t=>isToday(t.date));

}


function totalTodaySales(){

    return todayTransactions()
        .reduce((sum,t)=>sum+Number(t.total),0);

}


function totalTodayProfit(){

    return todayTransactions()
        .reduce((sum,t)=>sum+Number(t.profit),0);

}


function totalTodayTransactions(){

    return todayTransactions().length;

}


function totalTodayCollected(){

    return cashCollections
        .filter(c=>isToday(c.date))
        .reduce((sum,c)=>sum+Number(c.amount),0);

}


function lowStockProducts(){

    return products.filter(p=>p.stock<=p.min);

}


function employeeSales(employeeId){

    return todayTransactions()
        .filter(t=>t.employeeId===employeeId)
        .reduce((sum,t)=>sum+Number(t.total),0);

}


function employeeTransactionCount(employeeId){

    return todayTransactions()
        .filter(t=>t.employeeId===employeeId)
        .length;

}


function branchSales(branch){

    return todayTransactions()
        .filter(t=>t.branch===branch)
        .reduce((sum,t)=>sum+Number(t.total),0);

}


function branchTransactionCount(branch){

    return todayTransactions()
        .filter(t=>t.branch===branch)
        .length;

}

async function login(){

function showProductSuggestions(inputId,suggestionId){

    const input=document.getElementById(inputId);

    const box=document.getElementById(suggestionId);

    if(!input || !box) return;

    const q=input.value.trim().toLowerCase();

    if(!q){

        box.innerHTML="";

        return;

    }


    const matches=products.filter(p=>
        p.name.toLowerCase().includes(q)
        ||
        p.sku.toLowerCase().includes(q)
    );


    box.innerHTML=matches.map(p=>`

        <div class="suggestion"
             onclick="selectPOSProduct(${p.id})">

            <strong>
                ${p.name}
            </strong>

            <small>
                SKU: ${p.sku}
                • Stock: ${p.stock}
                • ${money(p.price)}
            </small>

        </div>

    `).join("");


    if(!matches.length){

        box.innerHTML=
            `<div class="suggestion">
                No product found.
             </div>`;

    }

}


function selectPOSProduct(productId){

    const product=products.find(p=>p.id===productId);

    if(!product) return;

    if(product.stock<=0){

        alert("This product is out of stock.");

        return;

    }


    const existing=card.find(i=>i.productId===productId);

    if(existing){

        if(existing.qty>=product.stock){

            alert("Not enough stock.");

            return;

        }

        existing.qty++;

    }else{

        card.push({
            productId:product.id,
            name:product.name,
            price:product.price,
            cost:product.cost,
            qty:1
        });

    }


    const input=document.getElementById("posSearch");

    if(input) input.value="";

    const box=document.getElementById("posSuggestions");

    if(box) box.innerHTML="";

    renderCart();

}

                        ${item.name}
                    </strong>

                    <strong>
                        ${money(item.price*item.qty)}
                    </strong>

                </div>

                <div class="qty-controls">

                    <button
                        class="qty-btn"
                        onclick="changeCartQty(${index},-1)">
                        −
                    </button>

                    <strong>
                        ${item.qty}
                    </strong>

                    <button
                        class="qty-btn"
                        onclick="changeCartQty(${index},1)">
                        +
                    </button>

                    <button
                        class="btn btn-red"
                        style="padding:7px 10px;margin-left:auto;"
                        onclick="removeCartItem(${index})">

                        Remove

                    </button>

                </div>

            </div>

        `).join("")+

        `

        <div class="card">

            <div class="row">

                <strong>
                    TOTAL
                </strong>

                <strong style="font-size:22px;">
                    ${money(total)}
                </strong>

            </div>

            <button
                class="btn btn-green"
                style="width:100%;margin-top:12px;"
                onclick="completeSale()">

                COMPLETE SALE

            </button>

        </div>

        `;

}


function changeCartQty(index,change){

    const item=card[index];

    const product=products.find(
        p=>p.id===item.productId
    );

    item.qty+=change;


    if(item.qty<=0){

        card.splice(index,1);

    }


    if(product && item.qty>product.stock){

        item.qty=product.stock;

        alert("Maximum available stock reached.");

    }


    renderCart();

}


function removeCartItem(index){

    card.splice(index,1);

    renderCart();

}


async function completeSale(){
    if(!card.length){alert("Cart is empty.");return;}
    const saleCart=card.map(i=>({...i}));
    let total=0,profit=0;
    
    for(const item of saleCart){
        const p=products.find(x=>String(x.id)===String(item.productId));
        if(!p || p.stock < item.qty){
            alert("Insufficient stock for " + item.name);
            return;
        }
        total += Number(item.price) * Number(item.qty);
        profit += (Number(item.price) - Number(item.cost)) * Number(item.qty);
        p.stock -= item.qty; // deduct locally
    }

    const tx = {
        id: "TX-" + String(Date.now()).slice(-8),
        date: new Date().toISOString(),
        branch: currentUser.branch,
        employee: currentUser.name,
        employeeId: currentUser.id,
        items: saleCart,
        total,
        profit
    };

    transactions.unshift(tx);
    saveLocalData();

    if(navigator.onLine && databaseReady){
        try {
            await _supabase.from("transactions").insert({
                id: tx.id,
                date: tx.date,
                branch: tx.branch,
                employee: tx.employee,
                employee_id: tx.employeeId,
                items: tx.items,
                total: tx.total,
                profit: tx.profit
            });
        } catch(e){
            console.warn("Failed syncing transaction online, saved in queue.", e);
            const q = getOfflineQueue();
            q.push({type: "insert_transaction", data: tx});
            saveOfflineQueue(q);
        }
    } else {
        const q = getOfflineQueue();
        q.push({type: "insert_transaction", data: tx});
        saveOfflineQueue(q);
    }

    card=[]; 
    alert("SALE COMPLETED (Offline/Online Sync Active)\n\nTransaction: "+tx.id+"\nTotal: "+money(total)); 
    renderDashboard();
}

/* =====================================================
   LIVE REAL-TIME CAMERA BARCODE SCANNER LOGIC (SIMPLIFIED VIDEO STREAM)
===================================================== */

async function startLiveCameraScanner() {
    if (!('BarcodeDetector' in window)) {
        alert("Ang iyong browser ay hindi sumusuporta sa Live BarcodeDetector API.");
        return;
    }

    showModal(
        "📷 Live Barcode Scanner",
        `
        <div style="text-align: center;">
            <video id="liveScannerVideo" autoplay playsinline style="width: 100%; max-height: 250px; background: #000; border-radius: 12px; object-fit: cover;"></video>
            <p style="margin-top: 10px; font-size: 12px; color: #6b7280;">Itapat lang ang camera sa barcode. Awtomatikong kukunin ang code at ilalagay sa SKU / Barcode field.</p>
        </div>
        `
    );

    try {
        const videoElement = document.getElementById("liveScannerVideo");
        
        // Use the rear camera on phones when available.
        activeCameraStream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: { ideal: "environment" },
                width: { ideal: 1280 },
                height: { ideal: 720 }
            },
            audio: false
        });

        videoElement.srcObject = activeCameraStream;
        isScanningLive = true;

        const barcodeDetector = new BarcodeDetector({
            formats: ['code_128', 'ean_13', 'ean_8', 'qr_code', 'upc_a', 'upc_e']
        });

        // Start scanning only after the camera has produced usable frames.
        await videoElement.play();

        const scanFrame = async () => {
            if (!isScanningLive) return;

            try {
                if (videoElement.readyState >= HTMLMediaElement.HAVE_ENOUGH_DATA) {
                    const barcodes = await barcodeDetector.detect(videoElement);

                    if (barcodes.length > 0 && barcodes[0].rawValue) {
                        const detectedCode = barcodes[0].rawValue.trim();
                        const skuField = document.getElementById('newSku');

                        if (skuField) {
                            // Barcode only: do NOT save the item automatically.
                            skuField.value = detectedCode;
                            skuField.dispatchEvent(new Event('input', { bubbles: true }));
                            skuField.focus();
                        }

                        stopLiveCameraScanner();
                        closeModal();
                        return;
                    }
                }
            } catch (err) {
                console.error("Scanning frame error:", err);
            }

            if (isScanningLive) {
                requestAnimationFrame(scanFrame);
            }
        };

        requestAnimationFrame(scanFrame);

    } catch (err) {
        console.error("Camera access error:", err);
        alert("Hindi mabuksan ang camera. Siguraduhing pinayagan ang pahintulot sa browser.");
        closeModal();
    }
}

function stopLiveCameraScanner() {
    isScanningLive = false;
    if (activeCameraStream) {
        activeCameraStream.getTracks().forEach(track => track.stop());
        activeCameraStream = null;
    }
}

    const sizes = document.getElementById("newSizes").value;

    const min = Number(document.getElementById("newMin").value) || 0;

    if(!name){
        name = (category ? category : "Item") + (sizes ? " " + sizes : "");
    }

    if(!sku){ alert("SKU is required."); return; } 

    const newProdObj = {
        id: Date.now(),
        name, sku, category, size: sizes, model, color, supplier, cost, price, stock, minimum: min, target, image
    };

    products.push(normalizeProduct(newProdObj));

                name, sku, category, size: sizes, model, color, supplier, cost, price, stock, minimum: min, target, image

    } else {

let selectedRestockProductId=null;


function showRestockSuggestions(){

    const input=document.getElementById("restockSearch");

    const box=document.getElementById("restockSuggestions");

    const q=input.value.toLowerCase().trim();


    selectedRestockProductId=null;


    const matches=products.filter(p=>
        p.name.toLowerCase().includes(q)
        ||
        p.sku.toLowerCase().includes(q)
    );


    box.innerHTML=matches.map(p=>`

        <div class="suggestion"
             onclick="selectRestockProduct(${p.id})">

            <strong>${p.name}</strong>

            <small>
                SKU: ${p.sku}
                • Current Stock: ${p.stock}
            </small>

        </div>

    `).join("");

}


function selectRestockProduct(id){

    const p=products.find(x=>x.id===id);

    selectedRestockProductId=id;

    document.getElementById("restockSearch").value=p.name;

    document.getElementById("restockSuggestions").innerHTML="";

}


async function performRestock(){
    if(!selectedRestockProductId){alert("Please select a product.");return;}
    const qty=Number(document.getElementById("restockQty").value); if(!qty||qty<=0){alert("Enter a valid quantity.");return;}
    
    const p=products.find(x=>String(x.id)===String(selectedRestockProductId));
    if(!p){alert("Product not found.");return;}
    
    p.stock += qty;
    saveLocalData();

    if(navigator.onLine && databaseReady){
        try {
            await _supabase.from("products").update({stock: p.stock}).eq("id", p.id);
        } catch(e){ console.warn("Restock sync failed:", e); }
    }

    alert("RESTOCK COMPLETED\n\n"+p.name+"\nAdded: "+qty+"\nNew Stock: "+p.stock);
    showSection("restock");
}

async function recordCashCollection(){
    const branch=document.getElementById("collectionBranch").value,amount=Number(document.getElementById("collectionAmount").value),purpose=document.getElementById("collectionPurpose").value,pin=document.getElementById("collectionPin").value;
    if(!amount||amount<=0){alert("Enter a valid amount.");return;}if(pin!==OWNER_PIN){alert("❌ Incorrect Owner PIN.\n\nCash collection was NOT recorded.");return;}
    
    const cashObj = {
        id: Date.now(),
        date: new Date().toISOString(),
        branch,
        amount,
        collectedBy: currentUser.name,
        purpose
    };

    cashCollections.unshift(normalizeCash(cashObj));
    saveLocalData();

    if(navigator.onLine && databaseReady){
        try {
            await _supabase.from("cash_collections").insert({
                date: cashObj.date,
                branch: cashObj.branch,
                amount: cashObj.amount,
                collected_by: cashObj.collectedBy,
                purpose: cashObj.purpose
            });
        } catch(e){
            const q = getOfflineQueue();
            q.push({type: "insert_cash", data: cashObj});
            saveOfflineQueue(q);
        }
    } else {
        const q = getOfflineQueue();
        q.push({type: "insert_cash", data: cashObj});
        saveOfflineQueue(q);
    }

    alert("✅ CASH COLLECTION RECORDED (Synced)\n\nBranch: "+branch+"\nAmount: "+money(amount));
    showSection("cash");
}

async function savePassword(){
    const oldPassword=document.getElementById("oldPassword").value,newPassword=document.getElementById("newPassword").value,confirmPassword=document.getElementById("confirmPassword").value;
    if(currentUser.role==="owner"){if(oldPassword!==OWNER_PIN){alert("Incorrect current Owner PIN.");return;}alert("Owner PIN is currently configured in the app code as 1234.");closeModal();return;}
    const employee=employees.find(e=>e.employeeId===currentUser.id);if(!employee||employee.password!==oldPassword){alert("Incorrect current password.");return;}if(!newPassword){alert("Enter a new password.");return;}if(newPassword!==confirmPassword){alert("New passwords do not match.");return;}
    
    employee.password = newPassword;
    saveLocalData();

    if(navigator.onLine && databaseReady){
        try { await _supabase.from("employees").update({password: newPassword}).eq("id", employee.id); } catch(e){}
    }

    alert("Password changed successfully.");
    closeModal();
}

<script>
\n/* =====================================================\n   LOW STOCK NOTIFICATION\n===================================================== */\nlet lastLowStockSignature = "";\nlet stockNotificationTimer = null;\n\nfunction getLowStockItemsForNotification(){\n    try {\n        return typeof lowStockProducts === "function" ? lowStockProducts() : (Array.isArray(products) ? products.filter(p => Number(p.stock) <= Number(p.min)) : []);\n    } catch(e){\n        return [];\n    }\n}\n\nfunction showStockNotification(items){\n    const box=document.getElementById("stockNotification");\n    const text=document.getElementById("stockNotificationText");\n    if(!box || !text) return;\n    const count=items.length;\n    const names=items.slice(0,3).map(p=>p.name).join(", ");\n    text.textContent = count === 1 ? `${names} is low on stock.` : `${count} items are low on stock${names ? `: ${names}${count>3 ? "…" : ""}` : "."}`;\n    box.classList.add("show");\n    clearTimeout(stockNotificationTimer);\n    stockNotificationTimer=setTimeout(()=>box.classList.remove("show"),10000);\n}\n\nfunction hideStockNotification(){\n    const box=document.getElementById("stockNotification");\n    if(box) box.classList.remove("show");\n}\n\nasync function checkLowStockNotification(force=false){\n    const items=getLowStockItemsForNotification();\n    const signature=items.map(p=>`${p.id||p.sku}:${p.stock}:${p.min}`).sort().join("|");\n    if(!items.length){ lastLowStockSignature=""; hideStockNotification(); return; }\n    if(!force && signature===lastLowStockSignature) return;\n    lastLowStockSignature=signature;\n    showStockNotification(items);\n    if("Notification" in window){\n        try {\n            if(Notification.permission === "granted") new Notification("Motor Shop — Low Stock", {body:`${items.length} item(s) need restocking.`});\n        } catch(e){}\n    }\n}\n\nfunction requestLowStockNotifications(){\n    if("Notification" in window && Notification.permission === "default") Notification.requestPermission().catch(()=>{});\n}\n
</script>
\n<script>\nwindow.addEventListener("load",()=>{\n    requestLowStockNotifications();\n    setTimeout(()=>checkLowStockNotification(true),1200);\n    setInterval(()=>checkLowStockNotification(false),30000);\n});\n</script>\n</body>
